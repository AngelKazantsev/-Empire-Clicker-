<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Empire Clicker — Админ-панель</title><meta name="robots" content="noindex">
<style>
:root{
  --bg:#050814;--panel:#0b1020;--panel2:#0e1428;--line:#222b4d;--text:#f5f4ff;--muted:#9aa3c7;
  --purple:#6c2cff;--purple2:#9b5cff;--blue:#3e6cff;--green:#12e6a0;--red:#ff5470;--gold:#ffc857;
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 65% 0%,#15133a 0,#080b17 34%,#04060d 100%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app{display:flex;min-height:100vh}
.sidebar{width:255px;flex:none;background:rgba(4,7,18,.92);border-right:1px solid #1d2541;padding:22px 15px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{display:flex;gap:12px;align-items:center;padding:5px 10px 24px}
.logoIcon{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#6f31ff,#25105e);box-shadow:0 0 30px #6c2cff55;font-size:25px}
.logo b{font-size:19px;letter-spacing:1px}.logo small{color:#a6a8c7}
.nav{display:grid;gap:6px}
.nav button{border:0;background:transparent;color:#aeb5d4;padding:13px 14px;border-radius:12px;text-align:left;display:flex;align-items:center;gap:13px;transition:.2s}
.nav button:hover{background:#17152d;color:#fff}.nav button.active{background:linear-gradient(90deg,#6b25f7,#4b1ec8);color:white;box-shadow:0 8px 25px #6024f744}
.ico{width:25px;text-align:center;font-size:19px}
.sideBottom{margin-top:auto;border:1px solid #20294a;background:#0b1020;border-radius:15px;padding:13px}
.statusDot{width:10px;height:10px;background:var(--green);border-radius:50%;box-shadow:0 0 14px var(--green);display:inline-block;margin-right:8px}
.main{flex:1;min-width:0}
.top{height:76px;border-bottom:1px solid #1c2440;background:rgba(4,7,17,.65);backdrop-filter:blur(15px);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:10}
.search{max-width:620px;flex:1;position:relative}.search span{position:absolute;left:14px;top:10px;color:#7781aa}.search input{width:100%;background:#080d1c;border:1px solid #2b365c;color:white;border-radius:13px;padding:11px 14px 11px 42px;outline:none}.search input:focus{border-color:#7444ff;box-shadow:0 0 0 3px #6c2cff18}
.topActions{margin-left:auto;display:flex;align-items:center;gap:8px}.iconBtn{border:1px solid #252e50;background:#0c1224;color:#dfe2ff;width:43px;height:43px;border-radius:13px}.iconBtn:hover{border-color:#7651ff}.admin{display:flex;align-items:center;gap:10px;margin-left:8px;padding-left:13px;border-left:1px solid #242c49}.avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(145deg,#7a42ff,#20124d);display:grid;place-items:center}
.content{padding:24px;max-width:1700px;margin:auto}
.page{display:none}.page.active{display:block}
.hero{height:145px;border:1px solid #31376c;border-radius:19px;overflow:hidden;position:relative;background:linear-gradient(90deg,#11132b,#22134e 60%,#111327)}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,12,29,.96),rgba(15,10,39,.62),rgba(12,12,29,.18))}
.heroArt{position:absolute;right:0;top:0;width:58%;height:100%;background:radial-gradient(circle at 70% 35%,#9b5cff55,transparent 35%),linear-gradient(135deg,transparent 20%,#25164f 100%);clip-path:polygon(25% 0,100% 0,100% 100%,0 100%)}
.heroText{position:relative;z-index:2;padding:25px 32px}.heroText h1{margin:0 0 7px;font-size:28px}.heroText p{margin:0;color:#b9c0df}.crown{font-size:34px;margin-right:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:15px}
.card{background:linear-gradient(145deg,#0d1327,#090e1c);border:1px solid #222d52;border-radius:17px;box-shadow:0 10px 35px #0003}
.stat{padding:18px}.statTop{display:flex;gap:12px;align-items:center;color:#aeb6d6;font-size:13px}.statIcon{width:42px;height:42px;border-radius:13px;background:#21134e;display:grid;place-items:center;font-size:20px;color:#b991ff}.statValue{font-size:25px;font-weight:750;margin:9px 0 5px}.up{color:var(--green);font-size:12px}
.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(290px,1fr);gap:15px;margin-top:15px}
.panel{padding:18px}.panelHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.panelHead h2{font-size:17px;margin:0}.tabs{display:flex;gap:5px}.tabs button{border:0;background:transparent;color:#9099bc;padding:7px 12px;border-radius:9px}.tabs button.active{background:#6930f5;color:white}
.chart{height:260px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chartGrid line{stroke:#202947}.chartText{fill:#7782a8;font-size:11px}.chartLine{fill:none;stroke:#a15dff;stroke-width:4;filter:drop-shadow(0 0 7px #8e45ff)}.chartArea{fill:url(#grad);opacity:.35}
.quick{display:grid;gap:9px}.quick button{width:100%;border:1px solid #273257;background:#0c1326;color:#fff;border-radius:13px;padding:12px;display:flex;align-items:center;gap:12px;text-align:left}.quick button:hover{border-color:#7044f8;background:#111936}.quick .qico{width:39px;height:39px;border-radius:12px;background:#24144f;display:grid;place-items:center;color:#bb91ff}
.activity{margin-top:15px}.activityRow{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid #1d2642}.activityRow:last-child{border:0}.miniAvatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#211b42}.activityText{flex:1}.activityText b{display:block;font-size:13px}.activityText span{font-size:11px;color:#818aab}.money{color:var(--green);font-weight:700;font-size:12px}
.bottomGrid{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:15px;margin-top:15px}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th{color:#717b9f;text-align:left;font-weight:500;padding:8px;border-bottom:1px solid #222c4b}.table td{padding:10px 8px;border-bottom:1px solid #18213b}.rank{color:#c79aff;font-weight:800}
.bar{height:7px;background:#1c2542;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6d2fff,#a96bff);border-radius:9px}
.system{display:grid;gap:10px}.systemRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1c2541;font-size:12px}.online{color:var(--green)}
.pageTitle{font-size:27px;margin:5px 0 20px}.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.input,.select{background:#0b1121;border:1px solid #273255;color:#fff;padding:11px 13px;border-radius:11px;outline:0}.primary{background:linear-gradient(90deg,#7432ff,#5420d0);border:0;color:white;padding:11px 15px;border-radius:11px}.danger{background:#3b1520;border:1px solid #743044;color:#ff8298;padding:11px 15px;border-radius:11px}
.usersTable td,.usersTable th{padding:13px 10px}.userCell{display:flex;gap:9px;align-items:center}.badge{font-size:10px;padding:4px 7px;border-radius:7px;background:#1b2550;color:#aebaff}.badge.green{background:#083a32;color:#53f2c5}.badge.red{background:#401a27;color:#ff8299}
.cardsGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.setting{padding:18px}.setting h3{margin:0 0 7px}.setting p{color:#8d96b7;font-size:13px;margin:0 0 15px}.toggle{width:47px;height:26px;border:0;border-radius:20px;background:#273151;position:relative}.toggle i{position:absolute;width:20px;height:20px;left:3px;top:3px;background:#cbd0e8;border-radius:50%;transition:.2s}.toggle.on{background:#6c2cff}.toggle.on i{left:24px;background:white}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:100}.modal.open{display:flex}.modalBox{width:min(500px,92vw);background:#0b1121;border:1px solid #35416b;border-radius:18px;padding:22px;box-shadow:0 30px 90px #000}.modalHead{display:flex;justify-content:space-between;align-items:center}.modalBox h2{margin:0}.close{background:transparent;border:0;color:#aeb6d3;font-size:24px}.form{display:grid;gap:11px;margin-top:17px}.form input,.form textarea,.form select{background:#070c18;border:1px solid #29345a;color:white;padding:11px;border-radius:10px;outline:0}.form textarea{min-height:90px;resize:vertical}
.toast{position:fixed;right:22px;bottom:22px;background:#10172b;border:1px solid #39476e;padding:13px 17px;border-radius:12px;box-shadow:0 15px 40px #0008;display:none;z-index:200}.toast.show{display:block}
@media(max-width:1150px){.sidebar{width:80px}.logo b,.logo small,.nav button span:not(.ico),.sideBottom span{display:none}.nav button{justify-content:center}.content{padding:16px}.bottomGrid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.sidebar{display:none}.top{padding:0 12px}.content{padding:12px}.grid2,.bottomGrid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.admin .adminText{display:none}.hero{height:150px}.heroText h1{font-size:23px}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.top .search{display:none}.cardsGrid{grid-template-columns:1fr}.statValue{font-size:22px}}

/* Mobile / touch administration */
.mobileMenuBtn,.mobileNav,.mobileSheet{display:none}
@media(max-width:800px){
  body{padding-bottom:78px;overflow-x:hidden}
  .app{min-height:calc(100vh - 78px)}
  .main{width:100%}
  .top{height:64px;position:sticky;padding:0 10px;gap:8px}
  .mobileMenuBtn{display:grid;place-items:center;width:42px;height:42px;border:1px solid #29345a;background:#0b1121;color:#fff;border-radius:12px;font-size:20px}
  .topActions{gap:5px}.topActions .iconBtn{width:40px;height:40px}.admin{margin-left:2px;padding-left:6px}.avatar{width:38px;height:38px}.adminText{display:none}
  .content{padding:10px;max-width:none}
  .hero{height:auto;min-height:155px}.heroText{padding:20px 18px}.heroText p{max-width:80%;font-size:13px;line-height:1.45}.heroText h1{font-size:22px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px;border-radius:14px}.statIcon{width:36px;height:36px}.statValue{font-size:19px}.statTop{font-size:11px}
  .grid2,.bottomGrid{grid-template-columns:1fr;gap:10px}.panel{padding:14px}.chart{height:210px}.tabs{overflow:auto;max-width:52%}.tabs button{white-space:nowrap}
  .tableWrap{overflow-x:auto}.table{min-width:650px}.usersTable{min-width:760px}
  .toolbar{display:grid;grid-template-columns:1fr 1fr}.toolbar .input{grid-column:1/-1;width:100%}.toolbar button{width:100%}.select{width:100%}
  .cardsGrid{grid-template-columns:1fr;gap:10px}
  .pageTitle{font-size:24px;margin:3px 0 14px}
  .sidebar{display:none!important}
  .mobileNav{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:8px;right:8px;bottom:8px;height:68px;background:rgba(7,10,19,.94);border:1px solid #30395c;border-radius:21px;z-index:80;backdrop-filter:blur(18px);box-shadow:0 15px 50px #000b;padding:5px}
  .mobileNav button{border:0;background:transparent;color:#8e98b9;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px}.mobileNav button small{font-size:9px}.mobileNav button.active{background:linear-gradient(145deg,#7131ff,#4b1bd0);color:#fff;box-shadow:0 5px 20px #6c2cff55}
  .mobileSheet{position:fixed;left:10px;right:10px;bottom:84px;background:#0b1121;border:1px solid #30395c;border-radius:22px;padding:10px;z-index:90;transform:translateY(130%);opacity:0;pointer-events:none;transition:.22s;box-shadow:0 25px 80px #000c}.mobileSheet.open{transform:translateY(0);opacity:1;pointer-events:auto}.sheetHandle{width:42px;height:4px;border-radius:4px;background:#515b7c;margin:2px auto 12px}.sheetGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.sheetGrid button{min-height:76px;border:1px solid #29345a;background:#10172a;color:#fff;border-radius:15px;font-size:21px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.sheetGrid button span{font-size:10px;color:#b8c0dd}
  .modalBox{width:calc(100vw - 22px);max-height:88vh;overflow:auto;padding:17px;border-radius:20px}.form input,.form textarea,.form select{font-size:16px;min-height:46px}.primary,.danger,.toggle{min-height:44px}
  .quick button{min-height:62px}.bottomGrid .table{min-width:560px}
}
@media(max-width:430px){.stats{grid-template-columns:1fr 1fr}.statValue{font-size:17px}.heroText p{max-width:100%}.heroArt{width:75%;opacity:.7}.topActions .iconBtn:nth-child(2){display:none}.sheetGrid{grid-template-columns:repeat(2,1fr)}}
/* Light mode */
body.light{background:#eef1f8;color:#161a2b}body.light .sidebar,body.light .top,body.light .mobileNav,body.light .mobileSheet{background:rgba(248,249,253,.96);border-color:#d6dbea}body.light .card,body.light .panel,body.light .stat,body.light .quick button,body.light .input,body.light .select,body.light .iconBtn,body.light .mobileMenuBtn,body.light .sheetGrid button,body.light .modalBox{background:#fff;color:#171b2c;border-color:#d7dceb}body.light .nav button{color:#606a86}body.light .nav button.active{color:#fff}body.light .muted,body.light small{color:#68718c}body.light .chartGrid line{stroke:#d9deeb}body.light .chartText{fill:#727b94}

.loginWrap{min-height:100vh;display:grid;place-items:center;padding:20px}.loginBox{width:min(380px,100%);padding:30px 26px;text-align:center}.loginBox h1{margin:12px 0 4px;font-size:24px}.loginBox p{color:#8d96b7;font-size:13px;margin:0 0 18px}.loginBox input{width:100%;background:#070c18;border:1px solid #29345a;color:#fff;padding:13px;border-radius:12px;outline:0;margin-bottom:10px;text-align:center;font-size:16px}.loginBox input:focus{border-color:#7444ff}.err{color:#ff8298;font-size:13px;min-height:18px;margin-bottom:8px}
.hidden{display:none!important}.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;color:#8d96b7;font-size:13px}.pager button{min-width:40px}
.kpiRow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1c2541;font-size:13px}.kpiRow:last-child{border:0}
.hbars{display:grid;gap:9px}.hbar{display:grid;grid-template-columns:90px 1fr 46px;gap:10px;align-items:center;font-size:12px;color:#aeb6d6}.hbar .bar{height:9px;margin:0}.hbar b{text-align:right;color:#fff}
.formRow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{font-size:12px;color:#8d96b7;margin-bottom:-6px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>*{flex:1;min-width:120px}
.mini{padding:7px 11px;border-radius:9px;font-size:12px}.chip{display:inline-block;font-size:11px;padding:3px 8px;border-radius:7px;background:#1b2550;color:#aebaff;margin:2px 3px 2px 0}
.annItem{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #1d2642}.annItem:last-child{border:0}.annItem>div{flex:1}.annItem small{color:#7f89ad}
.pulse{animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.45}}
.donut{width:120px;height:120px;border-radius:50%;position:relative;flex:none}.donut div{position:absolute;inset:24px;background:#0b1020;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:11px}
.legend{font-size:12px;line-height:2}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.back{border:1px solid #2b365c;background:#0c1224;color:#dfe2ff;border-radius:12px;padding:10px 14px}
.empty{text-align:center;padding:30px;color:#7f89ad}
body.light .loginBox input,body.light .form input,body.light .form textarea,body.light .form select{background:#fff;color:#171b2c;border-color:#d7dceb}
table.table td,table.table th{white-space:nowrap}
/* окна и формы не выходят за края экрана */
#modal *{min-width:0;box-sizing:border-box}
#modal input,#modal select,#modal textarea,#modal button{max-width:100%}
.formRow,.row2{min-width:0}.formRow>*,.row2>*{min-width:0;max-width:100%}
.form input,.form select,.form textarea{min-width:0;max-width:100%}
select{font:inherit}
</style></head><body>

<div id="login" class="loginWrap hidden"><div class="card loginBox"><div class="logoIcon" style="margin:auto">♛</div><h1>Админ-панель</h1><p>Empire Clicker · введите пароль администратора</p>
<input id="pw" type="password" placeholder="Пароль" autocomplete="off"><div class="err" id="loginErr"></div><button class="primary" style="width:100%" onclick="doLogin()">Войти</button></div></div>

<div class="app hidden" id="app">
<aside class="sidebar"><div class="logo"><div class="logoIcon">♛</div><div><b>EMPIRE</b><br><small>CLICKER</small></div></div>
<nav class="nav" id="nav"></nav>
<div class="sideBottom"><span class="statusDot" id="srvDot"></span><span id="srvTxt">Сервер работает<br><small style="color:#7883a8">Проверка…</small></span></div></aside>
<main class="main">
<header class="top"><button class="mobileMenuBtn" onclick="openMore()">☰</button>
<div class="search"><span>⌕</span><input id="globalSearch" placeholder="Поиск по игрокам, ID, нику..." onkeydown="if(event.key==='Enter'){userQ=this.value;go('users')}"></div>
<div class="topActions"><button class="iconBtn" title="Обновить" onclick="refresh()">⟳</button><button class="iconBtn" title="Тема" onclick="toggleTheme()">☼</button><button class="back" onclick="exitPanel()">← В игру</button>
<div class="admin"><div class="avatar">♛</div><div class="adminText"><b>admin</b><br><small style="color:#7f89ad">Главный администратор</small></div></div></div></header>
<section class="content" id="content"></section></main></div>

<nav class="mobileNav" id="mobileNav"></nav>
<div class="mobileSheet" id="mobileSheet"><div class="sheetHandle"></div><div class="sheetGrid" id="sheetGrid"></div></div>
<div class="modal" id="modal"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div class="form" id="modalForm"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:0})+' ♛';
const nf=n=>Math.floor(Number(n)||0).toLocaleString('ru-RU');
const ago=t=>{if(!t)return '—';const s=(Date.now()-t)/1000;if(s<60)return 'сейчас';if(s<3600)return Math.floor(s/60)+' мин. назад';if(s<86400)return Math.floor(s/3600)+' ч. назад';return Math.floor(s/86400)+' дн. назад'};
const dt=t=>t?new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const PAGES=[['home','⌂','Главная'],['users','♙','Пользователи'],['economy','◉','Экономика'],['stats','▥','Игровая статистика'],['bonuses','🎁','Бонусы'],['events','▣','События'],['messages','✎','Сообщения'],['settings','⚙','Настройки'],['security','♢','Безопасность']];
const MOB=['home','users','economy','events'];
const EMBED=new URLSearchParams(location.search).has('embed');
let page='home',userQ='',userF='all',userS='seen',userP=1,range=14,OV=null,timer=0;
const TOK=()=>sessionStorage.getItem('ec_admin')||'';
async function api(path,body,method){
 const o={method:method||(body?'POST':'GET'),headers:{'x-admin-token':TOK(),'Content-Type':'application/json'}};if(body)o.body=JSON.stringify(body);
 const r=await fetch('/api/admin/'+path,o);let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){if(r.status===401&&path!=='login')showLogin();throw new Error(j.error||'Ошибка сервера')}return j}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.borderColor=bad?'#743044':'#39476e';e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
/* вход */
function showLogin(){$('#app').classList.add('hidden');$('#mobileNav').style.display='none';$('#login').classList.remove('hidden');$('#pw').focus();clearInterval(timer)}
async function doLogin(){const pw=$('#pw').value;$('#loginErr').textContent='';try{const j=await api('login',{password:pw});sessionStorage.setItem('ec_admin',j.token);start()}catch(e){$('#loginErr').textContent=e.message}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#login').classList.contains('hidden'))doLogin()});
function exitPanel(){if(EMBED&&parent!==window)parent.postMessage({ec:'close'},'*');else location.href='/'}
async function logout(){try{await api('logout',{})}catch(e){}sessionStorage.removeItem('ec_admin');showLogin()}
function start(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#mobileNav').style.display='';buildNav();go(page);clearInterval(timer);timer=setInterval(()=>{if(localStorage.getItem('ec_adm_auto')!=='0'&&!$('#modal').classList.contains('open')&&!document.hidden)refresh(true)},20000);ping()}
async function ping(){const t=Date.now();try{await fetch('/api/leaderboard?limit=1');const ms=Date.now()-t;$('#srvDot').style.background='var(--green)';$('#srvTxt').innerHTML='Сервер работает<br><small style="color:#7883a8">Отклик '+ms+' мс</small>'}catch(e){$('#srvDot').style.background='var(--red)';$('#srvTxt').innerHTML='Нет связи<br><small style="color:#7883a8">Проверьте сеть</small>'}}

function lineChart(data,key){const W=700,H=260,L=45,B=235,T=25,max=Math.max(1,...data.map(d=>d[key])),n=data.length;
 const pts=data.map((d,i)=>[L+i*(635/Math.max(1,n-1)),B-(d[key]/max)*(B-T)]);const line=pts.map(p=>p.join(',')).join(' ');
 const grid=[0,1,2,3,4].map(i=>{const y=T+i*(B-T)/4;return `<line x1="${L}" y1="${y}" x2="680" y2="${y}"/><text x="2" y="${y+4}">${Math.round(max*(1-i/4))}</text>`}).join('');
 const lab=data.map((d,i)=>i%Math.ceil(n/6)===0?`<text x="${pts[i][0]-14}" y="255">${d.d}</text>`:'').join('');
 return `<svg viewBox="0 0 700 265" preserveAspectRatio="none"><defs><linearGradient id="grad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9b5cff"/><stop offset="1" stop-color="#9b5cff" stop-opacity="0"/></linearGradient></defs><g class="chartGrid chartText">${grid}${lab}</g><polyline class="chartArea" points="${line} ${pts[n-1][0]},${B} ${L},${B}"/><polyline class="chartLine" points="${line}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#d9c6ff"/>`).join('')}</svg>`}
function hbars(list){const m=Math.max(1,...list.map(x=>x.n));return '<div class="hbars">'+list.map(x=>`<div class="hbar"><span>${esc(x.l)}</span><div class="bar"><i style="width:${x.n/m*100}%"></i></div><b>${x.n}</b></div>`).join('')+'</div>'}
const COL=['#6f31ff','#9d45ff','#2e82ff','#55b9ff','#694cbd','#12e6a0'];
function donut(list,centerTop){const t=list.reduce((s,x)=>s+x.n,0)||1;let a=0;const seg=list.map((x,i)=>{const p=x.n/t*100,s=`${COL[i%6]} ${a}% ${a+p}%`;a+=p;return s}).join(',');
 return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="donut" style="background:conic-gradient(${t===1&&!list.some(x=>x.n)?'#222b4d 0 100%':seg})"><div>${centerTop}<small style="color:#7d87a9">игроков</small></div></div><div class="legend">${list.map((x,i)=>`<div><i style="background:${COL[i%6]}"></i>${esc(x.l)} <b>${x.n}</b></div>`).join('')}</div></div>`}
const stat=(ico,t,v,sub)=>`<div class="card stat"><div class="statTop"><div class="statIcon">${ico}</div>${t}</div><div class="statValue">${v}</div><span class="up">${sub||'&nbsp;'}</span></div>`;

 <div class="grid2"><div class="card panel"><h2>Распределение балансов</h2>${hbars(o.buckets)}</div><div class="card panel"><h2>Глобальный множитель</h2><p style="color:#8d96b7;font-size:13px">Повышает доход всех игроков на время.</p><div style="margin-bottom:10px">${evBadge(o.event)}</div><div class="form"><div class="formRow"><input id="eM" type="number" min="1" step="0.5" value="2" placeholder="Множитель"><input id="eH" type="number" min="0.1" step="0.5" value="1" placeholder="Часов"></div><input id="eN" value="Двойной доход" maxlength="40"><button class="primary" onclick="startEvent('e')">Запустить</button>${o.event?'<button class="danger" onclick="stopEvent()">Остановить событие</button>':''}</div></div></div>
 <div class="card panel" style="margin-top:15px"><div class="panelHead"><h2>📈 Множители экономики</h2></div><p style="color:#8d96b7;font-size:13px;margin:0 0 12px">Действуют на всех игроков сразу: доход за клик, пассивный доход (авто-кликер, питомец) и цены улучшений. 1 = без изменений.</p><div class="form"><div class="formRow"><label style="flex:1;font-size:12px;color:#8d96b7">Доход за клик<input id="cM" type="number" min="0.1" max="100" step="0.1" value="${cf.clickMul}" style="width:100%;margin-top:4px"></label><label style="flex:1;font-size:12px;color:#8d96b7">Пассивный доход<input id="iM" type="number" min="0.1" max="100" step="0.1" value="${cf.incomeMul}" style="width:100%;margin-top:4px"></label><label style="flex:1;font-size:12px;color:#8d96b7">Цены улучшений<input id="pM" type="number" min="0.1" max="100" step="0.1" value="${cf.priceMul}" style="width:100%;margin-top:4px"></label></div><button class="primary" onclick="saveCfg()">Сохранить множители</button></div></div>
 <div class="cardsGrid" style="margin-top:15px"><div class="card setting"><h3>🎁 Подарок всем</h3><p>Выдать валюту каждому игроку.</p><button class="primary" onclick="gift()">Выдать</button></div><div class="card setting"><h3>◉ Начисление игроку</h3><p>Ручное пополнение по ID.</p><button class="primary" onclick="balanceModal()">Начислить</button></div><div class="card setting"><h3>🛒 Скидка в магазине</h3><p>Процент скидки на всё за доллары. 0 — без скидки.</p><div class="formRow"><input id="sS" type="number" min="0" max="90" value="${cf.shopSale||0}" style="width:100%"><button class="primary" onclick="saveSale()">Применить</button></div></div></div>`};
async function startEvent(p){try{await api('event',{name:$('#'+p+'N').value,mult:$('#'+p+'M').value,hours:$('#'+p+'H').value});toast('Событие запущено ✔');closeModal();refresh(true)}catch(e){toast(e.message,1)}}
async function stopEvent(){try{await api('event',{stop:1});toast('Событие остановлено');refresh(true)}catch(e){toast(e.message,1)}}
R.stats=async(el)=>{const o=await api('overview'),t0=Date.now();
 el.innerHTML=`<h1 class="pageTitle">Игровая статистика</h1><div class="stats">${stat('◉','Кликов всего',nf(o.totalClicks),'по данным игроков')}${stat('♛','Средний уровень',o.avgLvl.toFixed(1),'уровень игрока')}${stat('⭐','Перерождений',nf(o.totalStars),'всего звёзд')}${stat('♙','Активных за сутки',nf(o.active24),'из '+o.players)}</div>
 <div class="grid2"><div class="card panel"><h2>Игроки по уровням</h2>${hbars(o.levels)}<h2 style="margin-top:22px">Визиты по дням (последний заход)</h2><div class="chart" style="height:200px">${lineChart(o.act,'n')}</div></div><div class="card panel"><h2>Состояние игры</h2><div class="system"><div class="systemRow"><span>Игровой сервер</span><b class="online">Online</b></div><div class="systemRow"><span>API</span><b class="online">Online</b></div><div class="systemRow"><span>База данных (Netlify Blobs)</span><b class="online">Online</b></div><div class="systemRow"><span>Регистрация</span><b class="${o.settings.regOpen?'online':''}">${o.settings.regOpen?'Открыта':'Закрыта'}</b></div><div class="systemRow"><span>Событие</span>${evBadge(o.event)}</div><div class="systemRow"><span>Версия</span><b>1.0.0</b></div></div></div></div>`};
R.bonuses=async(el)=>{const l=(await api('announcements')).list.filter(a=>a.c||a.tk||(a.items&&a.items.length));
 el.innerHTML=`<h1 class="pageTitle">Бонусы</h1><div class="cardsGrid"><div class="card setting"><h3>🎁 Подарок всем</h3><p>Валюта и билеты каждому игроку — получат при следующем входе.</p><button class="primary" onclick="gift()">Выдать всем</button></div><div class="card setting"><h3>🏆 Награда игроку</h3><p>Начисление конкретному игроку по ID.</p><button class="primary" onclick="balanceModal()">Выдать</button></div><div class="card setting"><h3>⚡ Событие ×2</h3><p>Быстрый запуск двойного дохода на 1 час.</p><button class="primary" onclick="quickEvent()">Запустить</button></div></div>
 <div class="card panel" style="margin-top:15px"><h2>Выданные подарки</h2>${annList(l,'Подарков пока не было')}</div>`};
async function quickEvent(){try{await api('event',{name:'Двойной доход',mult:2,hours:1});toast('Двойной доход на 1 час ✔')}catch(e){toast(e.message,1)}}
const annList=(l,emp)=>l.length?l.map(a=>`<div class="annItem"><div><b>${esc(a.title)}</b>${(a.c||a.tk||(a.items||[]).length)?` <span class="chip">${a.c?money(a.c):''}${a.tk?' 🎟️'+a.tk:''}${(a.items||[]).length?' 🛍'+a.items.length:''}</span>`:''}<br><span style="color:#aeb6d6;font-size:13px">${esc(a.text)}</span><br><small>${dt(a.t)} · до ${dt(a.exp)}</small></div><button class="danger mini" onclick="delAnn('${a.id}')">Удалить</button></div>`).join(''):'<div class="empty">'+emp+'</div>';
async function delAnn(id){try{await api('announce/delete',{id});toast('Удалено');refresh(true)}catch(e){toast(e.message,1)}}
R.events=async(el)=>{const j=await api('events');
 el.innerHTML=`<h1 class="pageTitle">События</h1><div class="grid2"><div class="card panel"><h2>Текущее событие</h2><div style="margin:10px 0">${evBadge(j.current)}</div>${j.current?`<p style="color:#8d96b7">До ${dt(j.current.until)}</p><button class="danger" onclick="stopEvent()">Остановить</button>`:'<p style="color:#8d96b7;font-size:13px">Запустите событие, и все игроки получат множитель дохода.</p>'}</div>
 <div class="card panel"><h2>Создать событие</h2><div class="form"><input id="vN" value="Королевская неделя" maxlength="40" placeholder="Название"><div class="formRow"><input id="vM" type="number" min="1" step="0.5" value="2" placeholder="Множитель ×"><input id="vH" type="number" min="0.1" step="0.5" value="24" placeholder="Часов"></div><button class="primary" onclick="startEvent('v')">＋ Запустить событие</button></div></div></div>
 <div class="card panel" style="margin-top:15px;overflow:auto"><h2>История событий</h2><table class="table"><thead><tr><th>Событие</th><th>Множитель</th><th>Длительность</th><th>Запущено</th></tr></thead><tbody>${j.history.map(h=>`<tr><td>${esc(h.name)}</td><td>×${h.mult}</td><td>${h.hours} ч</td><td>${dt(h.t)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Событий ещё не было</td></tr>'}</tbody></table></div>`};
R.messages=async(el)=>{const l=(await api('announcements')).list;
 el.innerHTML=`<h1 class="pageTitle">Сообщения</h1><div class="card panel"><h2>Рассылка игрокам</h2><p style="color:#8d96b7;font-size:13px">Сообщение появится у каждого игрока при ближайшем обновлении в игре (до 30 секунд).</p><div class="form"><input id="mT" maxlength="60" placeholder="Заголовок"><textarea id="mX" maxlength="500" placeholder="Текст сообщения"></textarea><input id="mH" type="number" min="1" placeholder="Показывать часов (по умолчанию 168)"><button class="primary" onclick="sendAnn('m')">Отправить всем</button></div></div>
 <div class="card panel" style="margin-top:15px"><h2>Отправленные</h2>${annList(l,'Сообщений пока нет')}</div>`};
R.settings=async(el)=>{const s=(await api('settings')).settings,cf=(await api('config')).cfg,auto=localStorage.getItem('ec_adm_auto')!=='0';
 el.innerHTML=`<h1 class="pageTitle">Настройки</h1><div class="cardsGrid"><div class="card setting"><h3>🆕 Регистрация</h3><p>Разрешить новым игрокам создавать аккаунты.</p><button class="toggle ${s.regOpen?'on':''}" onclick="setReg(${!s.regOpen})"><i></i></button></div><div class="card setting"><h3>🔄 Автообновление</h3><p>Обновлять данные панели каждые 20 секунд.</p><button class="toggle ${auto?'on':''}" onclick="localStorage.setItem('ec_adm_auto','${auto?0:1}');refresh()"><i></i></button></div><div class="card setting"><h3>🛠 Технические работы</h3><p>Закрывает игру заставкой у всех игроков.</p><input class="input" id="mT" maxlength="200" value="${esc(cf.maintText)}" style="width:100%;margin-bottom:10px"><button class="toggle ${cf.maintenance?'on':''}" onclick="setMaint(${!cf.maintenance})"><i></i></button></div><div class="card setting"><h3>☼ Светлая тема</h3><p>Режим интерфейса панели.</p><button class="toggle ${document.body.classList.contains('light')?'on':''}" onclick="toggleTheme();refresh()"><i></i></button></div></div>`};
async function saveCfg(){try{await api('config',{clickMul:+$('#cM').value,incomeMul:+$('#iM').value,priceMul:+$('#pM').value});toast('Множители сохранены');refresh(true)}catch(e){toast(e.message,1)}}
async function setMaint(v){try{await api('config',{maintenance:v,maintText:($('#mT')||{}).value});toast(v?'Технические работы включены':'Технические работы выключены');refresh(true)}catch(e){toast(e.message,1)}}
async function setReg(v){try{await api('settings',{regOpen:v});toast(v?'Регистрация открыта':'Регистрация закрыта');refresh(true)}catch(e){toast(e.message,1)}}
R.security=async(el)=>{const a=(await api('audit')).list;
 el.innerHTML=`<h1 class="pageTitle">Безопасность</h1><div class="cardsGrid"><div class="card setting"><h3>🔑 Пароль</h3><p>Смена пароля администратора.</p><button class="primary" onclick="pwModal()">Изменить пароль</button></div><div class="card setting"><h3>🛡 Сессии</h3><p>Завершить доступ на всех других устройствах.</p><button class="primary" onclick="revoke()">Завершить другие сессии</button></div><div class="card setting"><h3>⎋ Выход</h3><p>Выйти из панели администратора.</p><button class="danger" onclick="logout()">Выйти</button></div></div>
 <div class="card panel" style="margin-top:15px;overflow:auto"><h2>Журнал действий</h2><table class="table"><thead><tr><th>Время</th><th>Действие</th><th>Объект</th></tr></thead><tbody>${a.map(x=>`<tr><td>${dt(x.t)}</td><td>${esc(x.a)}</td><td>${esc(x.x)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Журнал пуст</td></tr>'}</tbody></table></div>`};
function pwModal(){openModal('Смена пароля',`<input id="pO" type="password" placeholder="Текущий пароль"><input id="pN" type="password" placeholder="Новый пароль (от 4 символов)"><button class="primary" onclick="chgPw()">Сохранить</button>`)}
async function chgPw(){try{await api('password',{old:$('#pO').value,new:$('#pN').value});toast('Пароль изменён ✔');closeModal()}catch(e){toast(e.message,1)}}
async function revoke(){try{const j=await api('revoke',{});toast('Завершено сессий: '+j.n);}catch(e){toast(e.message,1)}}
/* старт */
if(TOK()){api('overview').then(start).catch(showLogin)}else showLogin();
</script></body></html>
