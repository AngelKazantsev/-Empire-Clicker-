<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Empire Clicker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="config.js"></script><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#070714"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><div id="app"><main id="m"></main><nav class="tabs" id="tabs"></nav><div id="sheet"><div id="sp"><div class="top"><b id="st"></b><button data-a="close">✕</button></div><div id="sb"></div></div></div>
<div id="toast"></div></div>
<script>
const $=s=>document.querySelector(s);
const nf=n=>Math.floor(n).toLocaleString('ru-RU');
const copyTxt=t=>{try{navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}};
const money=n=>(Math.abs(n)<100&&n%1?n.toLocaleString('ru-RU',{maximumFractionDigits:1}):Math.floor(n).toLocaleString('ru-RU'));
const CN='<i class="cn">♛</i>';
const UP=[
{id:'click',n:'Усиление клика',d:'+1 монета за клик',i:'<span class="gi">👆</span>',k:'k1',b:50,g:1.5,s:1},
{id:'auto',n:'Авто-кликер',d:'Зарабатывает автоматически',i:'<svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2 4 7-3 1.5-4-7-5 4z" fill="#b39bff"/></svg>',k:'k2',b:250,g:1.6},
{id:'boost',n:'Буст монет',d:'Увеличивает доход на 50%',i:'<svg viewBox="0 0 24 24"><path d="M8 20V8M4 12l4-5 4 5M16 20V4M12 8l4-5 4 5" fill="none" stroke="#3fe08a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',k:'k3',b:500,g:1.8},
{id:'off',n:'Оффлайн доход',d:'Заработок пока ты не в игре',i:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',k:'k4',b:1000,g:2},
{id:'crit',n:'Бонус за клик',d:'Шанс получить x2 – x10',i:'🪙',k:'k5',b:2500,g:1.7,m:10},
{id:'spd',n:'Скорость дохода',d:'Увеличивает доход в секунду',i:'<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#a58bff"/><path d="M2 8h4M1 12h3M2 16h4" stroke="#a58bff" stroke-width="1.5" stroke-linecap="round"/></svg>',k:'k6',b:5000,g:1.8,m:20},
{id:'critm',n:'Мощь бонуса',d:'Растёт максимум множителя',i:'💥',b:3000,g:1.9,m:6},
{id:'btime',n:'Частый бонус',d:'Бонус ×2 на 30 сек чаще',i:'⏱️',b:600,g:1.8,m:6},
{id:'bdur',n:'Долгий бонус',d:'+10 сек к длительности ×2',i:'⌛',b:700,g:1.8,m:10},
{id:'gluck',n:'Частая монета',d:'Золотая монета чаще',i:'🍀',b:900,g:1.8,m:8},
{id:'gbig',n:'Крупная монета',d:'+50% к награде монеты',i:'💰',b:1100,g:1.9,m:10}];
const def=()=>({c:60,tot:0,clicks:0,crits:0,u:{},auto:0,bn:Date.now()+277000,dl:0,dlLast:0,streak:0,ac:{},last:Date.now(),tab:0,play:0,run:0,stars:0,tk:3,prem:'',x3:0,au5:0,skin:'neon',skins:{neon:1},ch:{c1:0,c2:0,c3:0},chOpen:0,buys:0,boosts:0,bt:{},maxBal:0,maxIps:0,maxHit:0,au5off:0,vol:100,mus:0,mvol:40,notif:0,tips:{},acf:'all',snd:0,vib:1,light:0,hist:[],dq:null,ups:0,pet:0,tut:0,fxq:2,nick:'',bosses:0,golds:0,maxMul:0,qdone:0,xp:0,plv:1,sub:0,seenAnn:[],gev:null});
/* защита от испорченных или чужих данных сохранения */
function fixS(o){const d=def();
 for(const k of Object.keys(d)){const t=d[k];
  if(Array.isArray(t)){if(!Array.isArray(o[k]))o[k]=[]}
  else if(t&&typeof t==='object'){if(!o[k]||typeof o[k]!=='object'||Array.isArray(o[k]))o[k]=JSON.parse(JSON.stringify(t))}
  else if(typeof t==='number'){if(typeof o[k]!=='number'||!Number.isFinite(o[k]))o[k]=t}
  else if(typeof t==='string'){if(typeof o[k]!=='string')o[k]=t}}
 for(const m of ['u','ac','ch','bt']){const x=o[m];for(const k of Object.keys(x)){if(m==='ac'){if(!x[k])delete x[k]}else if(typeof x[k]!=='number'||!Number.isFinite(x[k])||x[k]<0)delete x[k]}}
 for(const k of ['c','tot','tk','play','clicks','stars','pet','plv'])if(o[k]<0)o[k]=0;
 if(!o.skins||typeof o.skins!=='object')o.skins={neon:1};o.skins.neon=1;
 if(typeof o.dq!=='object')o.dq=null;if(o.dq&&(!Array.isArray(o.dq.q)||!o.dq.b))o.dq=null;
 if(typeof o.tab!=='number'||o.tab<0||o.tab>4)o.tab=0;
 return o}
let S=def();try{Object.assign(S,JSON.parse(localStorage.getItem('empire1')||'{}'))}catch(e){}fixS(S);
S.tab=0;if(!(S.sub>=0&&S.sub<=3))S.sub=0;
const save=()=>{S.last=Date.now();try{localStorage.setItem('empire1',JSON.stringify(S))}catch(e){}};
const lv=id=>S.u[id]||(id==='click'?1:0);
const U=id=>UP.find(x=>x.id===id);
let CFG={clickMul:1,incomeMul:1,priceMul:1,shopSale:0,maintenance:false};
const price=id=>{const u=U(id);return Math.max(1,Math.round(u.b*Math.pow(u.g,lv(id)-(u.s||0))*CFG.priceMul))};
const dur=()=>(30+10*lv('bdur'))*1000,gap=()=>Math.max(60,300-30*lv('btime'))*1000;
const bnOn=()=>{const n=Date.now();return n>=S.bn&&n<S.bn+dur()};
const EV=()=>{const d=new Date().getDay();return d===0||d===6?{n:'🎉 Выходные: доход ×1.5',m:1.5}:{n:'',m:1}};
const gev=()=>S.gev&&(!S.gev.until||S.gev.until>Date.now())?S.gev.m:1;
const gm=()=>gev()*EV().m*(1+.25*S.stars)*({gold:1.2,plat:1.35,black:1.5}[S.prem]||1)*(Date.now()<S.x3?3:1);
const base=()=>lv('click')*(1+.5*lv('boost'))*gm();
const cv=()=>base()*(bnOn()?2:1)*CFG.clickMul;
const turboOn=()=>Date.now()<S.au5&&!S.au5off;
const autoOn=()=>!!((S.auto&&lv('auto'))||turboOn());
const ips=()=>{const au=(S.auto&&lv('auto')?lv('auto'):0)+(turboOn()?5:0);return (au+S.pet*.3)*base()*(bnOn()?2:1)*(1+.25*lv('spd'))*CFG.incomeMul};
const need=()=>1000*S.plv;
function xpAdd(n){S.xp+=n;while(S.xp>=need()){S.xp-=need();S.plv++;const r=250*S.plv;add(r);toast('🎉 Уровень '+S.plv+'! Сундук: +'+money(r));sfx.buy()}}
const totLv=()=>UP.reduce((s,u)=>s+lv(u.id)-(u.s||0),0);
const pad=n=>String(n).padStart(2,'0'),mmss=s=>pad(Math.floor(s/60))+':'+pad(Math.floor(s%60));
const AC=[];[10,50,100,500,1000,5000,10000].forEach((n,i)=>AC.push({id:'k'+n,n:'Кликов: '+nf(n),r:20*Math.pow(3,i),p:()=>S.clicks,t:n}));
[100,1000,10000,100000,1000000].forEach((n,i)=>AC.push({id:'c'+n,n:'Всего монет: '+nf(n),r:50*Math.pow(4,i),p:()=>S.tot,t:n}));
[3,10,25].forEach((n,i)=>AC.push({id:'u'+n,n:'Уровней улучшений: '+n,r:100*Math.pow(5,i),p:totLv,t:n}));
[5,25].forEach(n=>AC.push({id:'x'+n,n:'Крит-ударов: '+n,r:n*10,p:()=>S.crits,t:n}));
const AR=(id,n,p,t,r,tk)=>AC.push({id,n,p,t,r,tk:tk||0});
[25000,100000].forEach((n,i)=>AR('k'+n,'Кликов: '+nf(n),()=>S.clicks,n,2000*Math.pow(4,i),i));
[1e7,1e8,1e9].forEach((n,i)=>AR('c'+n,'Всего монет: '+nf(n),()=>S.tot,n,5e4*Math.pow(10,i),i+1));
[50,100].forEach((n,i)=>AR('u'+n,'Уровней улучшений: '+n,totLv,n,2e4*Math.pow(5,i),1));
[100,500].forEach((n,i)=>AR('x'+n,'Крит-ударов: '+nf(n),()=>S.crits,n,3000*Math.pow(5,i),i));
[1.5,2,2.5,3].forEach((v,i)=>AR('m'+i,'Комбо ×'+v,()=>S.maxMul||0,v,300*Math.pow(3,i),i>1?1:0));
[1,5,15,40].forEach((n,i)=>AR('b'+n,'Побеждено боссов: '+n,()=>S.bosses,n,500*Math.pow(4,i),i>0?1:0));
[1,10,50].forEach((n,i)=>AR('g'+n,'Поймано золотых монет: '+n,()=>S.golds,n,400*Math.pow(5,i),i));
[1,3,10].forEach((n,i)=>AR('s'+n,'Перерождений (⭐): '+n,()=>S.stars,n,5000*Math.pow(6,i),i+1));
[1,5,10].forEach((n,i)=>AR('p'+n,'Уровень питомца: '+n,()=>S.pet,n,1000*Math.pow(4,i),i));
[3,7,14].forEach((n,i)=>AR('d'+n,'Ежедневная серия: '+n+' дн.',()=>S.streak,n,800*Math.pow(3,i),i+1));
[2,4,6].forEach((n,i)=>AR('z'+n,'Скинов открыто: '+n,()=>Object.keys(S.skins).length,n,1500*Math.pow(4,i),i));
[1,5,15].forEach((n,i)=>AR('q'+n,'Дней с выполненными заданиями: '+n,()=>S.qdone,n,600*Math.pow(4,i),i));
const AR2=(id,n,p,t,r,tk,it)=>AC.push({id,n,p,t,r:Math.min(1e13,Math.round(r)),tk:tk||0,it:it||null});
const itm=(i,len)=>i===len-1?{k:'chest',id:'c3',n:1}:(i+1)%5===0?{k:'chest',id:'c1',n:1}:(i+1)%7===0?{k:'boost',id:'x3',n:1}:null;
const GEN=(id,name,p,arr,base,g)=>arr.forEach((t,i)=>AR2(id+t,name.replace('{t}',nf(t)),p,t,base*Math.pow(g,i),(i+1)%3===0?Math.ceil((i+1)/3):0,itm(i,arr.length)));
GEN('k','Кликов: {t}',()=>S.clicks,[250,2500,50000,250000,500000,1e6,2.5e6,5e6,1e7],3000,3.2);
GEN('bal','Накопить монет: {t}',()=>S.maxBal||0,[1e3,1e4,1e5,1e6,1e7,1e8,1e9,1e10,1e11],200,6);
GEN('c','Всего монет: {t}',()=>S.tot,[1e10,1e11,1e12],5e6,12);
GEN('lv','Уровень игрока: {t}',()=>S.plv||1,[2,3,5,8,10,15,20,25,30,40,50,75,100],300,1.7);
GEN('u','Уровней улучшений: {t}',totLv,[150,200,300,500],1e5,4);
UP.forEach(u=>[1,5,10,25].filter(t=>t<=(u.m||1e9)).forEach((t,i,a)=>AR2('up_'+u.id+'_'+t,u.n+': уровень '+t,()=>lv(u.id)-(u.s||0),t,200*Math.pow(3.5,i)*(1+UP.indexOf(u)*.15),i===a.length-1?1:0,null)));
GEN('x','Крит-ударов: {t}',()=>S.crits,[1000,5000,20000],2e4,6);
GEN('b','Побеждено боссов: {t}',()=>S.bosses,[100,250,500],1e5,4);
['Пришелец','Дракон','Робот-прыгун','Призрак','Тролль','Кракен'].forEach((nm,ix)=>[1,10].forEach((t,i)=>AR2('bt_'+ix+'_'+t,t===1?'Победить босса: '+nm:'Победить босса «'+nm+'» ×'+t,()=>(S.bt||{})[nm]||0,t,(800+ix*200)*Math.pow(8,i),i,i?{k:'chest',id:'c2',n:1}:null)));
GEN('g','Поймано золотых монет: {t}',()=>S.golds,[100,250,500,1000],1e4,4);
GEN('s','Перерождений (⭐): {t}',()=>S.stars,[25,50,100],5e5,8);
GEN('p','Уровень питомца: {t}',()=>S.pet,[15,20,30,50],2e4,5);
GEN('d','Ежедневная серия: {t} дн.',()=>S.streak,[21,30,60,100],5e3,4);
AR2('z8','Скинов открыто: 8',()=>Object.keys(S.skins).length,8,5e4,2,{k:'chest',id:'c3',n:1});
GEN('q','Дней с выполненными заданиями: {t}',()=>S.qdone,[30,60,100,200],1e4,4);
GEN('ch','Открыто сундуков: {t}',()=>S.chOpen||0,[1,5,10,25,50,100,250],1500,3.5);
GEN('sh','Покупок в магазине: {t}',()=>S.buys||0,[1,5,10,25,50,100],1000,3.5);
[10,30,60,180,600,1440,3000].forEach((t,i,a)=>AR2('tm'+t,'Время в игре: '+(t<60?t+' мин':(t/60)+' ч'),()=>Math.floor(S.play/60),t,1500*Math.pow(3.2,i),(i+1)%3===0?(i+1)/3:0,itm(i,a.length)));
GEN('bo','Ускорителей активировано: {t}',()=>S.boosts||0,[1,5,10,25,50],1500,4);
GEN('mt','Получено достижений: {t}',()=>AC.filter(a=>S.ac[a.id]).length,[10,25,50,100,150],2000,7);
GEN('ip','Доход в секунду: {t}',()=>S.maxIps||0,[1,10,100,1e3,1e4],500,9);
GEN('ht','Максимальный клик: {t}',()=>S.maxHit||0,[10,100,1000],1500,8);
/* bindings */
let dispBal=0,lastTot=S.tot,dlN=0;
const B=k=>{if(k.startsWith('bx:')){const t=S[k.slice(3)]-Date.now();return t>0?mmss(t/1000):'—'}
 if(k==='bal')return money(dispBal);if(k==='ev')return gev()>1?'⚡ '+S.gev.n+' ×'+S.gev.m:(EV().n||'Зарабатывай по клику');if(k==='tot')return nf(S.tot);if(k==='cv')return '+'+money(cv());if(k==='cvh')return money(cv());if(k==='ips')return money(ips());if(k==='plv')return S.plv;if(k==='xpt')return nf(S.xp)+' / '+nf(need())+' опыта';
 if(k==='bn')return bnOn()?'Активен '+mmss((S.bn+dur()-Date.now())/1000):'Через '+mmss(Math.max(0,(S.bn-Date.now())/1000));
 if(k==='dl'){const r=S.dl-Date.now();return r>0?Math.floor(r/36e5)+'ч '+pad(Math.floor(r/6e4)%60)+'м':'Забрать'}
 if(k.startsWith('pr:'))return money(price(k.slice(3)));if(k.startsWith('lv:'))return 'Уровень '+(lv(k.slice(3))-(U(k.slice(3)).s||0));
 if(k==='tk')return S.tk;if(k==='st')return 'Серия: '+S.streak+' дн. · день '+(S.streak?((S.streak-1)%30)+1:1)+'/30';if(k==='pgt')return 'Получите ⭐ '+pg()+' · монет за забег: '+nf(S.run);
 return ''};
const bd=k=>`<span data-b="${k}">${B(k)}</span>`;
function sb(e,f,done){const w=f*100+'%',i=e.firstChild;if(i.style.width!==w)i.style.width=w;const bt=e.closest('.ur').querySelector('button'),no=f<1||done,tx=done?'Получено':'Забрать';if(bt.classList.contains('no')!==no)bt.classList.toggle('no',no);if(bt.textContent!==tx)bt.textContent=tx}
let lu=0,BN,PN,AN;
function upd(f){const nw=performance.now();if(!f&&nw-lu<90)return;lu=nw;if(S.tab===3&&claimN()!==ccount){render();return}dispBal+=(S.c-dispBal)*.3;if(Math.abs(S.c-dispBal)<1)dispBal=S.c;(BN||(BN=[...document.querySelectorAll('[data-b]')])).forEach(e=>{const v=B(e.dataset.b);if(e.textContent!==v)e.textContent=v});
 (PN||(PN=[...document.querySelectorAll('[data-p]')])).forEach(e=>{const u=U(e.dataset.p),mx=u.m&&lv(u.id)>=u.m;e.classList.toggle('no',mx||S.c<price(u.id))});
 const b=$('#bnc');if(b)b.classList.toggle('on',bnOn());
 const cb=$('#cmb');if(cb){const on=Date.now()-lastTap<800&&combo>=3;cb.textContent=on?'КОМБО ×'+cmul(combo).toFixed(1):'';cb.classList.toggle('on',on)}
 const w=$('#arc');if(w){const n=Date.now(),f=bnOn()?1-(n-S.bn)/dur():Math.min(1,1-(S.bn-n)/gap());w.style.strokeDashoffset=(1-Math.max(0,Math.min(1,f)))*503+''}
 (AN||(AN=[...document.querySelectorAll('[data-ac]')])).forEach(e=>{const a=AC.find(x=>x.id===e.dataset.ac),f=Math.min(1,a.p()/a.t);sb(e,f,!!S.ac[a.id])});
 if(S.tab===3)document.querySelectorAll('[data-q]').forEach(e=>{const q=S.dq.q[+e.dataset.q],f=Math.min(1,(QK[q.k][1]()-S.dq.b[q.k])/q.g);sb(e,f,!!q.c)});
 const xb=$('#xpb');if(xb){const w=Math.max(4,Math.min(100,S.xp/need()*100))+'%';if(xb.style.width!==w)xb.style.width=w}
 const be=$('.bal b');if(be){const l=be.textContent.length,fz=l>11?'12px':l>9?'15px':l>7?'18px':'21px';if(be.style.fontSize!==fz)be.style.fontSize=fz}
 const d=$('#dlb');if(d)d.classList.toggle('no',Date.now()<S.dl)}
function toast(t,bad){if(bad)sfx.bad();const e=$('#toast');e.textContent=t;e.className='on'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}
/* views */
const CROWN='<svg viewBox="0 0 64 64"><path d="M8 24l13 10 11-20 11 20 13-10-5 25H13z"/><rect x="13" y="51" width="38" height="6" rx="3"/></svg>';
const BOLT='<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>';
const TASK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const GIFT='<svg viewBox="0 0 24 24"><path d="M3 9h18v4H3zM5 13h14v8H5zM12 9v12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9C9 9 7.5 7.500 8 6c1-2 4 0 4 3zM12 9c3 0 4.500-1.500 4-3-1-2-4 0-4 3z" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const CART='<svg viewBox="0 0 24 24"><path d="M3 4h2l2.500 12h11L20 8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.600"/><circle cx="17" cy="20" r="1.600"/></svg>';
const CUR='<svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2 4 7-3 1.5-4-7-5 4z"/></svg>';
const BARS='<svg viewBox="0 0 16 16" class="bars"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="6" y="5" width="3" height="10" rx="1"/><rect x="11" y="1" width="3" height="14" rx="1"/></svg>';
const CHEST='<svg class="chest" viewBox="0 0 64 56"><path d="M6 24a26 15 0 0152 0v6H6z" fill="#34346a"/><rect x="6" y="28" width="52" height="24" rx="3" fill="#202046"/><rect x="26" y="25" width="12" height="15" rx="2" fill="#8f7bff"/><path d="M6 24h52M6 38h52" stroke="#7b5cff" stroke-width="2"/></svg>';
const IC=['<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>','<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>','<svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/></svg>','<svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v9h14v-9M12 8C9 8 7 6.5 7.5 5 8.5 3 12 5 12 8zM12 8c3 0 5-1.5 4.5-3-1-2-4.5 0-4.500 3z"/></svg>','<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg>'];
const TN=['Кликер','Улучшения','Магазин','Награды','Профиль'];
function tabs(){$('#tabs').innerHTML=TN.map((n,i)=>`<button class="${S.tab===i?'on':''}" data-a="tab" data-x="${i}">${IC[i]}${n}</button>`).join('')}
