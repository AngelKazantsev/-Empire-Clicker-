<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Empire Clicker — Админ-панель</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="admin.css"><script src="config.js"></script></head><body>

<div id="login" class="loginWrap hidden"><div class="card loginBox"><div class="logoIcon" style="margin:auto">♛</div><h1>Админ-панель</h1><p>Empire Clicker · введите пароль администратора</p>
<input id="pw" type="password" placeholder="Пароль" autocomplete="off"><input id="pc" class="hidden" inputmode="numeric" maxlength="6" placeholder="Код из приложения (2FA)" autocomplete="off" style="margin-top:8px"><div class="err" id="loginErr"></div><button class="primary" style="width:100%" onclick="doLogin()">Войти</button></div></div>

<div class="app hidden" id="app">
<aside class="sidebar"><div class="logo"><div class="logoIcon">♛</div><div><b>EMPIRE</b><br><small>CLICKER</small></div></div>
<nav class="nav" id="nav"></nav>
<div class="sideBottom"><span class="statusDot" id="srvDot"></span><span id="srvTxt">Сервер работает<br><small style="color:#7883a8">Проверка…</small></span></div></aside>
<main class="main">
<header class="top"><button class="mobileMenuBtn" onclick="openMore()">☰</button>
<div class="search"><span>⌕</span><input id="globalSearch" placeholder="Поиск по игрокам, ID, нику..." onkeydown="if(event.key==='Enter'){userQ=this.value;go('users')}"></div>
<div class="topActions"><button class="iconBtn" title="Обновить" onclick="refresh()">⟳</button><button class="iconBtn" title="Тема" onclick="toggleTheme()">☼</button><button class="back" onclick="exitPanel()">← В игру</button>
<div class="admin"><div class="avatar">♛</div><div class="adminText"><b>admin</b><br><small style="color:#7f89ad">Главный администратор</small></div></div></div></header>
<section class="content" id="content"></section></main></div>

<nav class="mobileNav" id="mobileNav"></nav>
<div class="mobileSheet" id="mobileSheet"><div class="sheetHandle"></div><div class="sheetGrid" id="sheetGrid"></div></div>
<div class="modal" id="modal"><div class="modalBox"><div class="modalHead"><h2 id="modalTitle"></h2><button class="close" onclick="closeModal()">×</button></div><div class="form" id="modalForm"></div></div></div>
<div class="toast" id="toast"></div>

<script>
const API_BASE=String(window.EC_API||'').replace(/\/$/,''),ONLINE=window.EC_API!=null;
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n||0).toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:0})+' ♛';
const nf=n=>Math.floor(Number(n)||0).toLocaleString('ru-RU');
const ago=t=>{if(!t)return '—';const s=(Date.now()-t)/1000;if(s<60)return 'сейчас';if(s<3600)return Math.floor(s/60)+' мин. назад';if(s<86400)return Math.floor(s/3600)+' ч. назад';return Math.floor(s/86400)+' дн. назад'};
const dt=t=>t?new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const PAGES=[['home','⌂','Главная'],['users','♙','Пользователи'],['economy','◉','Экономика'],['stats','▥','Игровая статистика'],['bonuses','🎁','Бонусы'],['events','▣','События'],['messages','✎','Сообщения'],['settings','⚙','Настройки'],['security','♢','Безопасность']];
const MOB=['home','users','economy','events'];
const EMBED=new URLSearchParams(location.search).has('embed');
let page='home',userQ='',userF='all',userS='seen',userP=1,range=14,OV=null,timer=0;
const TOK=()=>sessionStorage.getItem('ec_admin')||'';
async function api(path,body,method){
 const o={method:method||(body?'POST':'GET'),headers:{'x-admin-token':TOK(),'Content-Type':'application/json'}};if(body)o.body=JSON.stringify(body);
 const r=await fetch(API_BASE+'/api/admin/'+path,o);let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){if(r.status===401&&path!=='login')showLogin();throw new Error(j.error||'Ошибка сервера')}return j}
function toast(t,bad){const e=$('#toast');e.textContent=t;e.style.borderColor=bad?'#743044':'#39476e';e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}
/* вход */
function showLogin(){$('#app').classList.add('hidden');$('#mobileNav').style.display='none';$('#login').classList.remove('hidden');$('#pw').focus();clearInterval(timer)}
async function doLogin(){const pw=$('#pw').value;$('#loginErr').textContent='';if(!ONLINE){$('#loginErr').textContent='Сервер не подключён. Укажите его адрес в config.js (window.EC_API).';return}try{const j=await api('login',{password:pw,code:$('#pc').value});sessionStorage.setItem('ec_admin',j.token);start()}catch(e){if(e.message==='Нужен код 2FA'){$('#pc').classList.remove('hidden');$('#pc').focus();$('#loginErr').textContent='Введите код из приложения-аутентификатора'}else $('#loginErr').textContent=e.message}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!$('#login').classList.contains('hidden'))doLogin()});
function exitPanel(){if(EMBED&&parent!==window)parent.postMessage({ec:'close'},'*');else location.href='/'}
async function logout(){try{await api('logout',{})}catch(e){}sessionStorage.removeItem('ec_admin');showLogin()}
function start(){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#mobileNav').style.display='';buildNav();go(page);clearInterval(timer);timer=setInterval(()=>{if(localStorage.getItem('ec_adm_auto')!=='0'&&!$('#modal').classList.contains('open')&&!document.hidden)refresh(true)},20000);ping()}
async function ping(){const t=Date.now();try{await fetch(API_BASE+'/api/leaderboard?limit=1');const ms=Date.now()-t;$('#srvDot').style.background='var(--green)';$('#srvTxt').innerHTML='Сервер работает<br><small style="color:#7883a8">Отклик '+ms+' мс</small>'}catch(e){$('#srvDot').style.background='var(--red)';$('#srvTxt').innerHTML='Нет связи<br><small style="color:#7883a8">Проверьте сеть</small>'}}
function buildNav(){$('#nav').innerHTML=PAGES.map(p=>`<button data-page="${p[0]}" onclick="go('${p[0]}')"><span class="ico">${p[1]}</span><span>${p[2]}</span></button>`).join('');
 const m=MOB.map(id=>PAGES.find(p=>p[0]===id));$('#mobileNav').innerHTML=m.map(p=>`<button data-page="${p[0]}" onclick="go('${p[0]}')"><span>${p[1]}</span><small>${p[2].split(' ')[0]}</small></button>`).join('')+`<button onclick="openMore()"><span>☰</span><small>Ещё</small></button>`;
 $('#sheetGrid').innerHTML=PAGES.filter(p=>!MOB.includes(p[0])).map(p=>`<button onclick="go('${p[0]}');closeMore()">${p[1]}<span>${p[2]}</span></button>`).join('')+`<button onclick="exitPanel()">←<span>В игру</span></button>`}
const openMore=()=>$('#mobileSheet').classList.toggle('open'),closeMore=()=>$('#mobileSheet').classList.remove('open');
function go(id){page=id;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));closeMore();scrollTo({top:0});refresh()}
async function refresh(silent){const el=$('#content');if(!silent)el.innerHTML='<div class="empty pulse">Загрузка…</div>';try{await R[page](el,silent)}catch(e){if(!silent)el.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
const toggleTheme=()=>{document.body.classList.toggle('light');localStorage.setItem('ec_adm_light',document.body.classList.contains('light')?'1':'0')};
if(localStorage.getItem('ec_adm_light')==='1')document.body.classList.add('light');
/* модальное окно */
function openModal(title,html){$('#modalTitle').textContent=title;$('#modalForm').innerHTML=html;$('#modal').classList.add('open')}
function closeModal(){$('#modal').classList.remove('open')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
/* графики */
function lineChart(data,key){const W=700,H=260,L=45,B=235,T=25,max=Math.max(1,...data.map(d=>d[key])),n=data.length;
 const pts=data.map((d,i)=>[L+i*(635/Math.max(1,n-1)),B-(d[key]/max)*(B-T)]);const line=pts.map(p=>p.join(',')).join(' ');
 const grid=[0,1,2,3,4].map(i=>{const y=T+i*(B-T)/4;return `<line x1="${L}" y1="${y}" x2="680" y2="${y}"/><text x="2" y="${y+4}">${Math.round(max*(1-i/4))}</text>`}).join('');
 const lab=data.map((d,i)=>i%Math.ceil(n/6)===0?`<text x="${pts[i][0]-14}" y="255">${d.d}</text>`:'').join('');
 return `<svg viewBox="0 0 700 265" preserveAspectRatio="none"><defs><linearGradient id="grad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9b5cff"/><stop offset="1" stop-color="#9b5cff" stop-opacity="0"/></linearGradient></defs><g class="chartGrid chartText">${grid}${lab}</g><polyline class="chartArea" points="${line} ${pts[n-1][0]},${B} ${L},${B}"/><polyline class="chartLine" points="${line}"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#d9c6ff"/>`).join('')}</svg>`}
function hbars(list){const m=Math.max(1,...list.map(x=>x.n));return '<div class="hbars">'+list.map(x=>`<div class="hbar"><span>${esc(x.l)}</span><div class="bar"><i style="width:${x.n/m*100}%"></i></div><b>${x.n}</b></div>`).join('')+'</div>'}
const COL=['#6f31ff','#9d45ff','#2e82ff','#55b9ff','#694cbd','#12e6a0'];
function donut(list,centerTop){const t=list.reduce((s,x)=>s+x.n,0)||1;let a=0;const seg=list.map((x,i)=>{const p=x.n/t*100,s=`${COL[i%6]} ${a}% ${a+p}%`;a+=p;return s}).join(',');
 return `<div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap"><div class="donut" style="background:conic-gradient(${t===1&&!list.some(x=>x.n)?'#222b4d 0 100%':seg})"><div>${centerTop}<small style="color:#7d87a9">игроков</small></div></div><div class="legend">${list.map((x,i)=>`<div><i style="background:${COL[i%6]}"></i>${esc(x.l)} <b>${x.n}</b></div>`).join('')}</div></div>`}
const stat=(ico,t,v,sub)=>`<div class="card stat"><div class="statTop"><div class="statIcon">${ico}</div>${t}</div><div class="statValue">${v}</div><span class="up">${sub||'&nbsp;'}</span></div>`;
const evBadge=ev=>ev?`<span class="badge green">Активно: ${esc(ev.name)} ×${ev.mult}</span>`:'<span class="badge">Нет активных</span>';
/* страницы */
const R={};
R.home=async(el)=>{const o=OV=await api('overview');const ch=range===7?{reg:o.reg.slice(-7)}:{reg:o.reg};
 el.innerHTML=`<div class="hero"><div class="heroArt"></div><div class="heroText"><div><span class="crown">♛</span><b style="font-size:13px;color:#b5bde0">ПАНЕЛЬ УПРАВЛЕНИЯ</b></div><h1>Добро пожаловать, admin!</h1><p>Управляйте Empire Clicker, игроками, экономикой и событиями.</p></div></div>
 <div class="stats">${stat('♙','Всего игроков',nf(o.players),'+'+o.new7+' за 7 дней')}${stat('◉','Общий баланс игроков',money(o.totalBal),'заработано всего '+money(o.totalEarned))}${stat('♛','Онлайн сейчас',nf(o.online),'активных за сутки: '+o.active24)}${stat('◆','Новых за сутки',nf(o.new24),o.banned?'заблокировано: '+o.banned:'нарушителей нет')}</div>
 <div class="grid2"><div class="card panel"><div class="panelHead"><h2>▥ &nbsp;Новые игроки по дням</h2><div class="tabs"><button class="${range===7?'active':''}" onclick="range=7;refresh()">7 дней</button><button class="${range===14?'active':''}" onclick="range=14;refresh()">14 дней</button></div></div><div class="chart">${lineChart(ch.reg,'n')}</div></div>
 <div class="card panel"><div class="panelHead"><h2>⚡ Быстрые действия</h2></div><div class="quick">
  <button onclick="gift()"><div class="qico">🎁</div><div><b>Выдать бонус всем</b><br><small style="color:#7f89ab">Подарок всем игрокам</small></div><span style="margin-left:auto">›</span></button>
  <button onclick="balanceModal()"><div class="qico">◉</div><div><b>Начислить игроку</b><br><small style="color:#7f89ab">Ручное начисление</small></div><span style="margin-left:auto">›</span></button>
  <button onclick="go('events')"><div class="qico">▣</div><div><b>Запустить событие</b><br><small style="color:#7f89ab">Множитель дохода</small></div><span style="margin-left:auto">›</span></button>
  <button onclick="go('messages')"><div class="qico">✎</div><div><b>Отправить сообщение</b><br><small style="color:#7f89ab">Всем игрокам</small></div><span style="margin-left:auto">›</span></button></div></div></div>
 <div class="bottomGrid"><div class="card panel" style="overflow:auto"><div class="panelHead"><h2>♛ &nbsp;Топ игроков</h2><button class="primary" onclick="go('users')">Все игроки</button></div><table class="table"><thead><tr><th>#</th><th>Игрок</th><th>Ур.</th><th>Баланс</th><th>Заработано</th></tr></thead><tbody>${o.top.map(p=>`<tr style="cursor:pointer" onclick="openUser('${p.public_id}')"><td class="rank">${p.rank}</td><td><b>${esc(p.nick)}</b></td><td>${p.plv}</td><td>${money(p.bal)}</td><td class="money">${money(p.tot)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Игроков пока нет</td></tr>'}</tbody></table></div>
 <div class="card panel"><div class="panelHead"><h2>◉ &nbsp;Распределение балансов</h2></div>${donut(o.buckets,nf(o.players))}</div>
 <div class="card panel"><div class="panelHead"><h2>♟ &nbsp;Последняя активность</h2></div>${o.recent.map(a=>`<div class="activityRow" style="cursor:pointer" onclick="openUser('${a.public_id}')"><div class="miniAvatar">♛</div><div class="activityText"><b>${esc(a.nick)}</b><span>${a.seen-a.created<60000?'Зарегистрировался':'Был в игре'} · ${ago(a.seen)}</span></div><span class="money">${money(a.bal)}</span></div>`).join('')||'<div class="empty">Пока пусто</div>'}</div></div>`};
let usersT=0;
R.users=async(el,silent)=>{
 if(!el.querySelector('#userSearch')){el.innerHTML=`<h1 class="pageTitle">Пользователи</h1><div class="toolbar"><input class="input" id="userSearch" placeholder="Поиск по нику, логину или ID..." value="${esc(userQ)}" oninput="clearTimeout(usersT);usersT=setTimeout(()=>{userQ=this.value;userP=1;refresh(true)},300)"><select class="select" id="userFilter" onchange="userF=this.value;userP=1;refresh(true)">${[['all','Все игроки'],['online','Онлайн'],['banned','Заблокированные'],['sus','⚠ Подозрительные'],['new','Новые за сутки']].map(x=>`<option value="${x[0]}" ${userF===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><select class="select" onchange="userS=this.value;refresh(true)">${[['seen','По активности'],['bal','По балансу'],['tot','По заработку'],['lvl','По уровню'],['created','По регистрации']].map(x=>`<option value="${x[0]}" ${userS===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button class="primary" onclick="gift()">🎁 Бонус всем</button></div><div class="card panel tableWrap" style="overflow:auto"><div id="usersBox"></div></div>`}
 const j=await api(`users?q=${encodeURIComponent(userQ)}&filter=${userF}&sort=${userS}&page=${userP}`);
 $('#usersBox').innerHTML=`<table class="table usersTable"><thead><tr><th>Игрок</th><th>ID</th><th>Ур.</th><th>Баланс</th><th>Заработано</th><th>Статус</th><th>Был(а)</th><th></th></tr></thead><tbody>${j.rows.map(p=>{const on=j.now-p.seen<3e5;return `<tr><td><div class="userCell"><div class="miniAvatar">♟</div><div><b>${esc(p.nick)}</b><br><small style="color:#7f89ad">@${esc(p.username)}</small></div></div></td><td>#${p.public_id}</td><td>${p.plv}</td><td>${money(p.bal)}</td><td>${money(p.tot)}</td><td><span class="badge ${p.banned?'red':on?'green':''}">${p.banned?'Заблокирован':on?'Онлайн':'Офлайн'}</span></td><td>${ago(p.seen)}</td><td><button class="primary mini" onclick="openUser('${p.public_id}')">Открыть</button></td></tr>`}).join('')||'<tr><td colspan="8" class="empty">Игроки не найдены</td></tr>'}</tbody></table><div class="pager"><button class="primary mini" ${j.page<=1?'disabled':''} onclick="userP--;refresh(true)">‹</button><span>Страница ${j.page} из ${j.pages} · всего ${j.total}</span><button class="primary mini" ${j.page>=j.pages?'disabled':''} onclick="userP++;refresh(true)">›</button></div>`};
async function openUser(id){try{const j=await api('user?id='+encodeURIComponent(id)),p=j.row,s=j.save;
 const up=s&&s.u?Object.entries(s.u).filter(([k,v])=>v>0).map(([k,v])=>`<span class="chip">${esc(k)} ${v}</span>`).join(''):'';
 openModal('Игрок · '+p.nick,`<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="card setting"><small>ID</small><br><b>#${p.public_id}</b></div><div class="card setting"><small>Логин</small><br><b>@${esc(p.username)}</b></div><div class="card setting"><small>Баланс</small><br><b>${money(p.bal)}</b></div><div class="card setting"><small>Заработано</small><br><b>${money(p.tot)}</b></div><div class="card setting"><small>Уровень / ⭐</small><br><b>${p.plv} / ${p.stars}</b></div><div class="card setting"><small>Регистрация</small><br><b>${dt(p.created)}</b></div></div>
 ${s?`<div class="card setting"><small>Кликов: <b>${nf(s.clicks)}</b> · Крит-ударов: <b>${nf(s.crits)}</b> · Боссов: <b>${nf(s.bosses)}</b> · Серия: <b>${s.streak||0}</b> · Билетов: <b>${s.tk||0}</b> · В игре: <b>${Math.floor((s.play||0)/60)} мин</b></small><div style="margin-top:8px">${up||'<small>Улучшений нет</small>'}</div></div>`:'<div class="card setting"><small>Сохранения ещё нет</small></div>'}
 <label>Начислить игроку</label><div class="row2"><input id="uC" type="number" placeholder="Монеты ♛ (можно −)"><input id="uT" type="number" placeholder="Билеты 🎟️"><button class="primary" onclick="uAct('${id}','give',{c:$('#uC').value,tk:$('#uT').value})">Начислить</button></div><label>Предмет магазина</label><div class="row2" style="grid-template-columns:1fr 64px">${itemSel('u')}<button class="primary" style="grid-column:1/3" onclick="uAct('${id}','give',{items:readItems('u')})">Выдать предмет</button></div>
 <label>Достижения (200 наград)</label><div class="row2" style="grid-template-columns:1fr 1fr"><select id="uAc" style="grid-column:1/3"><option value="all">Все достижения</option><option value="money">💰 Деньги</option><option value="upg">⚡ Улучшения</option><option value="boss">👾 Бои</option><option value="misc">🎮 Прочее</option></select><button class="primary" onclick="uAct('${id}','ach',{mode:'unlock',cat:$('#uAc').value})">Выдать награды</button><button class="danger" onclick="uAct('${id}','ach',{mode:'reset',cat:'all'})">Сбросить</button></div>
 <label>Установить баланс</label><div class="row2"><input id="uB" type="number" min="0" placeholder="Новый баланс ♛"><button class="primary" onclick="uAct('${id}','setbal',{c:$('#uB').value})">Установить</button></div>
 <label>Ник</label><div class="row2"><input id="uN" value="${esc(p.nick)}" maxlength="20"><button class="primary" onclick="uAct('${id}','nick',{nick:$('#uN').value})">Сменить</button></div>
 <label>Новый пароль игрока</label><div class="row2"><input id="uP" placeholder="Любой пароль"><button class="primary" onclick="uAct('${id}','password',{password:$('#uP').value})">Сменить</button></div>
 <label>Личное сообщение</label><div class="row2"><input id="uM" maxlength="200" placeholder="Текст сообщения"><button class="primary" onclick="uAct('${id}','msg',{msg:$('#uM').value})">Отправить</button></div>
 <div class="row2" style="margin-top:6px"><button class="danger" onclick="uAct('${id}','${p.banned?'unban':'ban'}',{})">${p.banned?'✔ Разблокировать':'⛔ Заблокировать'}</button><button class="danger" id="rstB" onclick="armAct(this,'${id}','reset')">↺ Сбросить прогресс</button><button class="danger" id="delB" onclick="armAct(this,'${id}','delete')">🗑 Удалить аккаунт</button></div>`)}catch(e){toast(e.message,1)}}
async function uAct(id,action,extra){try{await api('user',{id,action,...extra});toast('Готово ✔');closeModal();refresh(true);if(page==='home')refresh(true)}catch(e){toast(e.message,1)}}
function armAct(b,id,a){if(b.dataset.arm){uAct(id,a,{});return}b.dataset.arm=1;b.textContent='Нажмите ещё раз для подтверждения';setTimeout(()=>{b.dataset.arm='';b.textContent=a==='reset'?'↺ Сбросить прогресс':'🗑 Удалить аккаунт'},3500)}
const ITEM_OPTS=[['Сундуки',[['chest:c1','📦 Обычный сундук'],['chest:c2','🎁 Редкий сундук'],['chest:c3','👑 Легендарный сундук']]],['Ускорители',[['boost:x3','🚀 Ускорение ×3 (10 мин)'],['boost:a5','🤖 Турбо-автоклик (10 мин)'],['boost:bn','⚡ Мгновенный бонус']]],['Скины',[['skin:gold','Золото'],['skin:ice','Лёд'],['skin:ruby','Рубин'],['skin:toxic','Кислота'],['skin:sakura','Сакура'],['skin:sunset','Закат'],['skin:mint','Мята']].map(([v,n])=>[v,'🎨 '+n])],['Премиум-карты',[['card:gold','💳 Gold'],['card:plat','💳 Platinum'],['card:black','💳 Black']]]];
const itemSel=p=>`<select id="${p}I"><option value="">Выберите предмет</option>${ITEM_OPTS.map(([g,o])=>`<optgroup label="${g}">${o.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}</optgroup>`).join('')}</select><input id="${p}N" type="number" min="1" max="100" value="1" title="Количество">`;
const readItems=p=>{const e=$('#'+p+'I'),v=e?e.value:'';return v?[{k:v.split(':')[0],id:v.split(':')[1],n:+($('#'+p+'N').value)||1}]:[]};
async function saveSale(){try{await api('config',{shopSale:+$('#sS').value});toast('Скидка в магазине обновлена');refresh(true)}catch(e){toast(e.message,1)}}
function balanceModal(){openModal('Начислить игроку',`<input id="bId" placeholder="ID игрока (например, AB12CD34)"><div class="formRow"><input id="bC" type="number" placeholder="Монеты ♛"><input id="bT" type="number" placeholder="Билеты 🎟️"></div><div class="formRow">${itemSel('b')}</div><input id="bM" maxlength="200" placeholder="Сообщение игроку (необязательно)"><button class="primary" onclick="giveById()">Начислить</button>`)}
async function giveById(){const id=$('#bId').value.trim().toUpperCase().replace('#','');try{await api('user',{id,action:'give',c:$('#bC').value,tk:$('#bT').value,items:readItems('b'),msg:$('#bM').value});toast('Начислено ✔');closeModal()}catch(e){toast(e.message,1)}}
function gift(){openModal('Выдать бонус всем игрокам',`<input id="gT" maxlength="60" placeholder="Заголовок" value="🎁 Подарок от администрации"><textarea id="gX" maxlength="500" placeholder="Текст сообщения"></textarea><div class="formRow"><input id="gC" type="number" min="0" placeholder="Монеты ♛ каждому"><input id="gK" type="number" min="0" placeholder="Билеты 🎟️"></div><div class="formRow">${itemSel('g')}</div><input id="gH" type="number" min="1" placeholder="Доступно часов (по умолчанию 72)"><button class="primary" onclick="sendAnn('g')">Отправить подарок</button>`)}
async function sendAnn(p){try{await api('announce',{title:$('#'+p+'T').value,text:$('#'+p+'X').value,c:$('#'+p+'C')?$('#'+p+'C').value:0,tk:$('#'+p+'K')?$('#'+p+'K').value:0,hours:$('#'+p+'H')?$('#'+p+'H').value:0,items:$('#'+p+'I')?readItems(p):[]});toast('Отправлено ✔');closeModal();refresh(true)}catch(e){toast(e.message,1)}}
R.economy=async(el)=>{const o=await api('overview'),cf=(await api('config')).cfg,avg=o.players?o.totalBal/o.players:0;
 el.innerHTML=`<h1 class="pageTitle">Экономика</h1><div class="stats">${stat('◉','В обращении',money(o.totalBal),'сумма балансов')}${stat('◆','Заработано всего',money(o.totalEarned),'за всё время')}${stat('♙','Средний баланс',money(avg),'на игрока')}${stat('🛒','Потрачено',money(Math.max(0,o.totalEarned-o.totalBal)),'заработано − баланс')}</div>
 <div class="grid2"><div class="card panel"><h2>Распределение балансов</h2>${hbars(o.buckets)}</div><div class="card panel"><h2>Глобальный множитель</h2><p style="color:#8d96b7;font-size:13px">Повышает доход всех игроков на время.</p><div style="margin-bottom:10px">${evBadge(o.event)}</div><div class="form"><div class="formRow"><input id="eM" type="number" min="1" step="0.5" value="2" placeholder="Множитель"><input id="eH" type="number" min="0.1" step="0.5" value="1" placeholder="Часов"></div><input id="eN" value="Двойной доход" maxlength="40"><button class="primary" onclick="startEvent('e')">Запустить</button>${o.event?'<button class="danger" onclick="stopEvent()">Остановить событие</button>':''}</div></div></div>
 <div class="card panel" style="margin-top:15px"><div class="panelHead"><h2>📈 Множители экономики</h2></div><p style="color:#8d96b7;font-size:13px;margin:0 0 12px">Действуют на всех игроков сразу: доход за клик, пассивный доход (авто-кликер, питомец) и цены улучшений. 1 = без изменений.</p><div class="form"><div class="formRow"><label style="flex:1;font-size:12px;color:#8d96b7">Доход за клик<input id="cM" type="number" min="0.1" max="100" step="0.1" value="${cf.clickMul}" style="width:100%;margin-top:4px"></label><label style="flex:1;font-size:12px;color:#8d96b7">Пассивный доход<input id="iM" type="number" min="0.1" max="100" step="0.1" value="${cf.incomeMul}" style="width:100%;margin-top:4px"></label><label style="flex:1;font-size:12px;color:#8d96b7">Цены улучшений<input id="pM" type="number" min="0.1" max="100" step="0.1" value="${cf.priceMul}" style="width:100%;margin-top:4px"></label></div><button class="primary" onclick="saveCfg()">Сохранить множители</button></div></div>
 <div class="cardsGrid" style="margin-top:15px"><div class="card setting"><h3>🎁 Подарок всем</h3><p>Выдать валюту каждому игроку.</p><button class="primary" onclick="gift()">Выдать</button></div><div class="card setting"><h3>◉ Начисление игроку</h3><p>Ручное пополнение по ID.</p><button class="primary" onclick="balanceModal()">Начислить</button></div><div class="card setting"><h3>🛒 Скидка в магазине</h3><p>Процент скидки на всё за доллары. 0 — без скидки.</p><div class="formRow"><input id="sS" type="number" min="0" max="90" value="${cf.shopSale||0}" style="width:100%"><button class="primary" onclick="saveSale()">Применить</button></div></div></div>`};
async function startEvent(p){try{await api('event',{name:$('#'+p+'N').value,mult:$('#'+p+'M').value,hours:$('#'+p+'H').value});toast('Событие запущено ✔');closeModal();refresh(true)}catch(e){toast(e.message,1)}}
async function stopEvent(){try{await api('event',{stop:1});toast('Событие остановлено');refresh(true)}catch(e){toast(e.message,1)}}
R.stats=async(el)=>{const o=await api('overview'),t0=Date.now();
 el.innerHTML=`<h1 class="pageTitle">Игровая статистика</h1><div class="stats">${stat('◉','Кликов всего',nf(o.totalClicks),'по данным игроков')}${stat('♛','Средний уровень',o.avgLvl.toFixed(1),'уровень игрока')}${stat('⭐','Перерождений',nf(o.totalStars),'всего звёзд')}${stat('♙','Активных за сутки',nf(o.active24),'из '+o.players)}</div>
 <div class="grid2"><div class="card panel"><h2>Игроки по уровням</h2>${hbars(o.levels)}<h2 style="margin-top:22px">Визиты по дням (последний заход)</h2><div class="chart" style="height:200px">${lineChart(o.act,'n')}</div></div><div class="card panel"><h2>Состояние игры</h2><div class="system"><div class="systemRow"><span>Игровой сервер</span><b class="online">Online</b></div><div class="systemRow"><span>API</span><b class="online">Online</b></div><div class="systemRow"><span>База данных (Netlify Blobs)</span><b class="online">Online</b></div><div class="systemRow"><span>Регистрация</span><b class="${o.settings.regOpen?'online':''}">${o.settings.regOpen?'Открыта':'Закрыта'}</b></div><div class="systemRow"><span>Событие</span>${evBadge(o.event)}</div><div class="systemRow"><span>Версия</span><b>1.0.0</b></div></div></div></div>
 <div class="grid2" style="margin-top:15px"><div class="card panel"><h2>Воронка игроков</h2>${hbars(o.funnel.map(([l,n])=>({l,n})))}</div><div class="card panel"><h2>Удержание</h2><div class="system"><div class="systemRow"><span>Вернулись на 2-й день</span><b>${o.retention.d1.of?Math.round(o.retention.d1.n/o.retention.d1.of*100)+'%':'—'} <small style="color:#7883a8">(${o.retention.d1.n} из ${o.retention.d1.of})</small></b></div><div class="systemRow"><span>Вернулись через неделю</span><b>${o.retention.d7.of?Math.round(o.retention.d7.n/o.retention.d7.of*100)+'%':'—'} <small style="color:#7883a8">(${o.retention.d7.n} из ${o.retention.d7.of})</small></b></div><div class="systemRow"><span>Подозрительных игроков</span><b>${o.sus}</b></div></div></div></div>`};
R.bonuses=async(el)=>{const l=(await api('announcements')).list.filter(a=>a.c||a.tk||(a.items&&a.items.length));
 el.innerHTML=`<h1 class="pageTitle">Бонусы</h1><div class="cardsGrid"><div class="card setting"><h3>🎁 Подарок всем</h3><p>Валюта и билеты каждому игроку — получат при следующем входе.</p><button class="primary" onclick="gift()">Выдать всем</button></div><div class="card setting"><h3>🏆 Награда игроку</h3><p>Начисление конкретному игроку по ID.</p><button class="primary" onclick="balanceModal()">Выдать</button></div><div class="card setting"><h3>⚡ Событие ×2</h3><p>Быстрый запуск двойного дохода на 1 час.</p><button class="primary" onclick="quickEvent()">Запустить</button></div></div>
 <div class="card panel" style="margin-top:15px"><h2>Выданные подарки</h2>${annList(l,'Подарков пока не было')}</div>`};
async function quickEvent(){try{await api('event',{name:'Двойной доход',mult:2,hours:1});toast('Двойной доход на 1 час ✔')}catch(e){toast(e.message,1)}}
const annList=(l,emp)=>l.length?l.map(a=>`<div class="annItem"><div><b>${esc(a.title)}</b>${(a.c||a.tk||(a.items||[]).length)?` <span class="chip">${a.c?money(a.c):''}${a.tk?' 🎟️'+a.tk:''}${(a.items||[]).length?' 🛍'+a.items.length:''}</span>`:''}<br><span style="color:#aeb6d6;font-size:13px">${esc(a.text)}</span><br><small>${dt(a.t)} · до ${dt(a.exp)}</small></div><button class="danger mini" onclick="delAnn('${a.id}')">Удалить</button></div>`).join(''):'<div class="empty">'+emp+'</div>';
async function delAnn(id){try{await api('announce/delete',{id});toast('Удалено');refresh(true)}catch(e){toast(e.message,1)}}
R.events=async(el)=>{const j=await api('events');
 el.innerHTML=`<h1 class="pageTitle">События</h1><div class="grid2"><div class="card panel"><h2>Текущее событие</h2><div style="margin:10px 0">${evBadge(j.current)}</div>${j.current?`<p style="color:#8d96b7">До ${dt(j.current.until)}</p><button class="danger" onclick="stopEvent()">Остановить</button>`:'<p style="color:#8d96b7;font-size:13px">Запустите событие, и все игроки получат множитель дохода.</p>'}</div>
 <div class="card panel"><h2>Создать событие</h2><div class="form"><input id="vN" value="Королевская неделя" maxlength="40" placeholder="Название"><div class="formRow"><input id="vM" type="number" min="1" step="0.5" value="2" placeholder="Множитель ×"><input id="vH" type="number" min="0.1" step="0.5" value="24" placeholder="Часов"></div><button class="primary" onclick="startEvent('v')">＋ Запустить событие</button></div></div></div>
 <div class="card panel" style="margin-top:15px;overflow:auto"><h2>История событий</h2><table class="table"><thead><tr><th>Событие</th><th>Множитель</th><th>Длительность</th><th>Запущено</th></tr></thead><tbody>${j.history.map(h=>`<tr><td>${esc(h.name)}</td><td>×${h.mult}</td><td>${h.hours} ч</td><td>${dt(h.t)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Событий ещё не было</td></tr>'}</tbody></table></div>`};
R.messages=async(el)=>{const l=(await api('announcements')).list;
 el.innerHTML=`<h1 class="pageTitle">Сообщения</h1><div class="card panel"><h2>Рассылка игрокам</h2><p style="color:#8d96b7;font-size:13px">Сообщение появится у каждого игрока при ближайшем обновлении в игре (до 30 секунд).</p><div class="form"><input id="mT" maxlength="60" placeholder="Заголовок"><textarea id="mX" maxlength="500" placeholder="Текст сообщения"></textarea><input id="mH" type="number" min="1" placeholder="Показывать часов (по умолчанию 168)"><button class="primary" onclick="sendAnn('m')">Отправить всем</button></div></div>
 <div class="card panel" style="margin-top:15px"><h2>Отправленные</h2>${annList(l,'Сообщений пока нет')}</div>`};
R.settings=async(el)=>{const s=(await api('settings')).settings,cf=(await api('config')).cfg,auto=localStorage.getItem('ec_adm_auto')!=='0';
 el.innerHTML=`<h1 class="pageTitle">Настройки</h1><div class="cardsGrid"><div class="card setting"><h3>🆕 Регистрация</h3><p>Разрешить новым игрокам создавать аккаунты.</p><button class="toggle ${s.regOpen?'on':''}" onclick="setReg(${!s.regOpen})"><i></i></button></div><div class="card setting"><h3>🔄 Автообновление</h3><p>Обновлять данные панели каждые 20 секунд.</p><button class="toggle ${auto?'on':''}" onclick="localStorage.setItem('ec_adm_auto','${auto?0:1}');refresh()"><i></i></button></div><div class="card setting"><h3>🛠 Технические работы</h3><p>Закрывает игру заставкой у всех игроков.</p><input class="input" id="mT" maxlength="200" value="${esc(cf.maintText)}" style="width:100%;margin-bottom:10px"><button class="toggle ${cf.maintenance?'on':''}" onclick="setMaint(${!cf.maintenance})"><i></i></button></div><div class="card setting"><h3>☼ Светлая тема</h3><p>Режим интерфейса панели.</p><button class="toggle ${document.body.classList.contains('light')?'on':''}" onclick="toggleTheme();refresh()"><i></i></button></div></div>`};
async function saveCfg(){try{await api('config',{clickMul:+$('#cM').value,incomeMul:+$('#iM').value,priceMul:+$('#pM').value});toast('Множители сохранены');refresh(true)}catch(e){toast(e.message,1)}}
async function setMaint(v){try{await api('config',{maintenance:v,maintText:($('#mT')||{}).value});toast(v?'Технические работы включены':'Технические работы выключены');refresh(true)}catch(e){toast(e.message,1)}}
async function setReg(v){try{await api('settings',{regOpen:v});toast(v?'Регистрация открыта':'Регистрация закрыта');refresh(true)}catch(e){toast(e.message,1)}}
R.security=async(el)=>{const a=(await api('audit')).list,sus=(await api('suspects')).rows,bk=(await api('backups')).list;
 el.innerHTML=`<h1 class="pageTitle">Безопасность</h1><div class="cardsGrid"><div class="card setting"><h3>🔑 Пароль</h3><p>Смена пароля администратора.</p><button class="primary" onclick="pwModal()">Изменить пароль</button></div><div class="card setting"><h3>🛡 Сессии</h3><p>Завершить доступ на всех других устройствах.</p><button class="primary" onclick="revoke()">Завершить другие сессии</button></div><div class="card setting"><h3>⎋ Выход</h3><p>Выйти из панели администратора.</p><button class="danger" onclick="logout()">Выйти</button></div></div>
 <div class="card panel" style="margin-top:15px;overflow:auto"><h2>⚠ Подозрительные игроки</h2><p style="color:#8d96b7;font-size:13px;margin:0 0 10px">Сервер сам проверяет скорость кликов, рост баланса и скачки заработка. Игрок с 3 подозрениями за сутки скрывается из рейтинга, пока вы не проверите его.</p><table class="table"><thead><tr><th>Игрок</th><th>Причины</th><th>Баланс</th><th></th></tr></thead><tbody>${sus.map(r=>`<tr><td><b>${esc(r.nick)}</b><br><small>#${r.public_id}${r.hidden?' · скрыт':''}${r.banned?' · блок':''}</small></td><td style="font-size:12px;color:#aeb6d6">${r.flags.slice(-3).map(f=>esc(f.f)+' ('+dt(f.t)+')').join('<br>')}</td><td>${money(r.bal)}</td><td style="white-space:nowrap"><button class="primary mini" onclick="susAct('${r.public_id}','clearsus')">Снять</button> <button class="danger mini" onclick="susAct('${r.public_id}','ban')">Блок</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Подозрительных игроков нет</td></tr>'}</tbody></table></div>
 <div class="card panel" style="margin-top:15px;overflow:auto"><div class="panelHead"><h2>💾 Резервные копии</h2><button class="primary" onclick="makeBk()">Создать сейчас</button></div><p style="color:#8d96b7;font-size:13px;margin:0 0 10px">Автоматическая копия делается раз в сутки, хранятся 7 последних. В копии: игроки, рейтинг, сохранения, кланы и настройки.</p><table class="table"><tbody>${bk.map(k=>`<tr><td>${esc(k)} (UTC)</td><td style="white-space:nowrap"><button class="primary mini" onclick="dlBk('${k}')">Скачать</button> <button class="danger mini" onclick="restoreModal('${k}')">Восстановить</button></td></tr>`).join('')||'<tr><td class="empty">Копий пока нет</td></tr>'}</tbody></table></div>
 <div class="card panel" style="margin-top:15px;overflow:auto"><h2>Журнал действий</h2><table class="table"><thead><tr><th>Время</th><th>Действие</th><th>Объект</th></tr></thead><tbody>${a.map(x=>`<tr><td>${dt(x.t)}</td><td>${esc(x.a)}</td><td>${esc(x.x)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Журнал пуст</td></tr>'}</tbody></table></div>`};
async function susAct(id,action){try{await api('user',{id,action});toast('Готово ✔');go('security')}catch(e){toast(e.message,1)}}
async function makeBk(){try{const j=await api('backup',{});toast('Копия создана: '+j.users+' игроков');go('security')}catch(e){toast(e.message,1)}}
async function dlBk(k){try{const r=await fetch(API_BASE+'/api/admin/backup/download?key='+encodeURIComponent(k),{headers:{'x-admin-token':TOK()}});if(!r.ok)throw new Error('Ошибка загрузки');const u=URL.createObjectURL(await r.blob()),l=document.createElement('a');l.href=u;l.download='empire-backup-'+k.replace(/[: ]/g,'-')+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast(e.message,1)}}
function restoreModal(k){openModal('Восстановить из копии',`<p style="color:#ffb3b3;font-size:13px">Данные игроков из копии <b>${esc(k)}</b> заменят текущие. Если игрок играл после создания копии, его новый прогресс будет перезаписан. Для подтверждения введите слово ВОССТАНОВИТЬ.</p><input id="rK" placeholder="ВОССТАНОВИТЬ"><button class="danger" onclick="doRestore('${k}')">Восстановить</button>`)}
async function doRestore(k){try{const j=await api('backup/restore',{key:k,confirm:$('#rK').value});toast('Восстановлено игроков: '+j.users);closeModal()}catch(e){toast(e.message,1)}}
function pwModal(){openModal('Смена пароля',`<input id="pO" type="password" placeholder="Текущий пароль"><input id="pN" type="password" placeholder="Новый пароль (от 8 символов)"><button class="primary" onclick="chgPw()">Сохранить</button>`)}
async function chgPw(){try{await api('password',{old:$('#pO').value,new:$('#pN').value});toast('Пароль изменён ✔');closeModal()}catch(e){toast(e.message,1)}}
async function revoke(){try{const j=await api('revoke',{});toast('Завершено сессий: '+j.n);}catch(e){toast(e.message,1)}}
/* старт */
if(TOK()){api('overview').then(start).catch(showLogin)}else showLogin();
</script></body></html>
