<style>
:root{--bg:#070714;--card:#0d0d22cc;--line:#2a2a5a;--mut:#9aa0c8;--p1:#7a5cff;--p2:#4a2fe0;--txt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;width:100%;margin:0;position:fixed;overflow:hidden;overscroll-behavior:none;background:#000;color:var(--txt);font-family:Inter,system-ui,sans-serif}

main{height:100%;padding:8px 14px 92px;overflow:hidden}
.v{animation:in .25s}@keyframes in{from{opacity:0}}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none;transition:transform .12s,filter .15s}
button:active{transform:scale(.95)}
.card{background:linear-gradient(160deg,#141433cc,#0a0a1ccc);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px #0008,inset 0 1px 0 #ffffff10}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:10px}

.hd h1{margin:0;font-size:19px;font-weight:800}.hd small{color:var(--mut);font-size:13px}
.hd .t{flex:1}
.balc{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:18px;text-align:left}
.balc small{font-size:11px;display:block}.balc b{font-size:19px}.balc i{font-style:normal;font-size:24px;color:var(--p1)}
.top{display:grid;grid-template-columns:1fr 132px 1fr;gap:8px;padding:12px 10px;align-items:center}
.top .l h4{margin:0;font-size:12.5px;font-weight:500;display:flex;gap:5px;align-items:center}
.big{font-size:34px;font-weight:800;display:flex;align-items:center;gap:6px;margin:6px 0 10px}
.cn{display:inline-grid;place-items:center;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#b9bdd6 55%,#7c819c);color:#5a5f80;font-style:normal;font-size:.62em;flex:none;box-shadow:0 2px 6px #0007}
.big .cn{font-size:26px}
.box{border:1px solid var(--line);border-radius:14px;padding:8px 10px;background:#0b0b1e}

.orb .halo{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,#7a5cff00,#7a5cff66,#7a5cff00 60%);animation:spin 5s linear infinite;filter:blur(6px)}
@keyframes spin{to{transform:rotate(360deg)}}
.core{position:absolute;inset:19px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,var(--p1),var(--p2) 65%,#0d0d30);box-shadow:0 0 30px #6a4cff99,inset 0 2px 8px #ffffff55;transition:transform .08s;font-size:44px}
.core span{filter:grayscale(1) brightness(4);animation:bob 1.8s infinite}

.orb.p .core{transform:scale(.92)}
.rp{position:fixed;width:20px;height:20px;margin:-10px;border-radius:50%;border:3px solid var(--p1);pointer-events:none;animation:rp .55s forwards;z-index:9}
@keyframes rp{to{transform:scale(6);opacity:0}}
.fl{position:fixed;font-weight:800;font-size:22px;pointer-events:none;z-index:9;animation:fl .9s forwards;text-shadow:0 2px 8px #000,0 0 10px #7a5cff}
.fl.c{color:#ffd166;font-size:28px}
@keyframes fl{to{transform:translateY(-80px) scale(1.15);opacity:0}}
.bn{padding:10px;border-radius:16px;border:1px solid var(--line);background:#0b0b1e;margin-bottom:8px}
.bn .r{display:flex;align-items:center;gap:8px}.bn .r>span{font-size:26px;color:var(--p1)}
.bn small{font-size:12px;color:var(--mut)}.bn b{display:block;font-size:22px;color:var(--p1);line-height:1}
.bn .tm{font-size:11px;color:var(--mut);margin-top:8px}
.bn.on{border-color:#8f7bff;box-shadow:0 0 18px #7a5cff88;animation:pl 1s infinite alternate}
@keyframes pl{to{box-shadow:0 0 28px #7a5cffcc}}
.au{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:16px;border:1px solid var(--line);background:#0b0b1e;font-size:11.5px}
.au small{display:block;color:var(--mut)}.au .t{flex:1}
.sw{width:42px;height:24px;border-radius:14px;background:#2b2b4a;border:1px solid #444;position:relative;transition:.25s;flex:none}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#aab;transition:.25s}
.sw.on{background:var(--p2);border-color:var(--p1)}.sw.on:after{left:21px;background:#fff}
h2{font-size:22px;margin:14px 0 8px;font-weight:800}
.ur{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-bottom:8px;border-radius:18px}

.up{background:linear-gradient(135deg,var(--p1),var(--p2));border-radius:16px;padding:11px 14px;font-weight:700;font-size:14px;box-shadow:0 6px 16px #4a2fe066,inset 0 1px 0 #ffffff44;flex:none}
.up.no{filter:grayscale(.7) brightness(.7)}
.dl{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;overflow:hidden;background:linear-gradient(120deg,#181850,#0d0d2a 60%,#2a1a8a)}
.dl .ic{font-size:28px;color:var(--p1)}.dl .tx{flex:1;z-index:1}.dl b{font-size:16px}.dl small{display:block;color:var(--mut);font-size:12px}
.dl .gf{position:absolute;right:96px;top:-4px;font-size:60px;filter:drop-shadow(0 0 14px #8f7bff);animation:bob 2.2s infinite}
.dl .up{z-index:1;padding:12px 18px}
.tabs{position:absolute;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;padding:6px;border-radius:30px;background:#0c0c20dd;border:1px solid var(--line);backdrop-filter:blur(12px);z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0;border-radius:24px;font-size:11.5px;color:var(--mut);font-weight:500;transition:.3s}
.tabs button.on{flex:1.5;color:#fff;background:linear-gradient(135deg,var(--p1),var(--p2));box-shadow:0 0 18px #6a4cff88}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fx{display:flex;flex-direction:column;height:100%}.lst{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:6px}
.lst::-webkit-scrollbar{display:none}
.pf{text-align:center;padding:18px}.av{width:80px;height:80px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:38px;background:linear-gradient(145deg,#7a5cff,#2a1aa8);box-shadow:0 0 26px #6a4cff88}
.rw{display:flex;justify-content:space-between;padding:11px 4px;border-bottom:1px solid #1e1e44;font-size:15px}.rw:last-child{border:0}.rw b{font-weight:700}
.pg{height:6px;background:#1d1d40;border-radius:4px;margin-top:6px;overflow:hidden}.pg i{display:block;height:100%;background:linear-gradient(90deg,#7a5cff,#b39bff);width:0;transition:width .3s}
#toast{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-150%);background:linear-gradient(135deg,var(--p1),var(--p2));padding:11px 18px;border-radius:20px;z-index:40;font-weight:600;font-size:14px;box-shadow:0 8px 24px #000a;transition:transform .35s cubic-bezier(.2,1.4,.4,1);max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}#toast.bad{background:#c0344f}

.up{color:#fff}
.cmb{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:11px;font-weight:800;background:linear-gradient(135deg,var(--p1),var(--p2));padding:3px 10px;border-radius:12px;white-space:nowrap;opacity:0;transition:opacity .15s;color:#fff;z-index:2}.cmb.on{opacity:1}
.gold{position:absolute;z-index:30;font-size:44px;background:none;animation:gd 1s infinite alternate,gi .4s;filter:drop-shadow(0 0 14px #ffd166)}
@keyframes gd{to{transform:translateY(-8px) rotate(12deg) scale(1.1)}}@keyframes gi{from{transform:scale(0)}}
.ur.buy{animation:fb .7s}@keyframes fb{30%{box-shadow:0 0 0 2px var(--p1),0 0 30px var(--p1);transform:scale(1.03)}}
.pr{background:linear-gradient(120deg,#3a2a8a88,#0d0d22)}
.pcd{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:8px;width:100%;text-align:left;padding:10px 10px 38px;margin-bottom:8px;border-radius:18px;background:#ffffff0d;border:1px solid var(--line);overflow:hidden}
.pcd .mc{border-radius:12px;height:82px;padding:9px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}
.pcd .mc b{font-size:19px}.pcd .mc small{font-size:8.5px;opacity:.85}
.pcd .pb{font-size:11.5px;text-align:right;line-height:1.5}
.pcd .pp{position:absolute;right:0;bottom:0;background:#ffffff26;padding:7px 16px 7px 26px;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);font-weight:700;font-size:14px}
.cir{display:inline-block;width:18px;height:18px;border-radius:50%;border:3px solid #ffffff88}
.sks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.sk{border-radius:16px;padding:10px 4px;font-size:12px;border:1px solid var(--line);background:#0b0b1e;text-align:center}
.sk i{display:block;width:34px;height:34px;border-radius:50%;margin:0 auto 6px;box-shadow:0 0 14px currentColor}
.sk small{color:var(--mut);font-size:10.5px}
.sk.on{border-color:var(--p1);box-shadow:0 0 14px color-mix(in srgb,var(--p1) 60%,transparent)}
input#nick{flex:1;min-width:0;border-radius:12px;border:1px solid var(--line);background:#0b0b1e;color:inherit;font-size:14px;padding:0 12px;user-select:text}.lt input#nick{background:#f2f3ff}.ur{contain:layout style}
.pid{color:var(--mut);font-size:10.5px;margin-left:6px;font-weight:400}.pidb{font-size:12px;color:var(--mut);margin-top:4px;cursor:pointer}
textarea{width:100%;height:64px;border-radius:12px;border:1px solid var(--line);background:#0b0b1e;color:inherit;font-size:11px;padding:8px;resize:none;user-select:text}
.rw.me{color:var(--p1);font-weight:700}
h2 small{font-size:13px;font-weight:500;color:var(--mut)}
.sm2{font-size:11px;color:var(--mut);margin:6px 2px 0}
.tabs button{font-size:10.5px}
.two{display:flex;gap:8px;margin-top:8px}.two button{flex:1;padding:11px}
#app.lt{--bg:#eceeff;--mut:#5b6090;--line:#cfd3f5;--txt:#14143a;color:#14143a;background:radial-gradient(90% 45% at 20% 0,#b9b0ff88,transparent 65%),#eceeff}
.lt .card{background:#fffffff0;box-shadow:0 6px 18px #6a6ab033}.lt .box,.lt .bn,.lt .au,.lt .sk,.lt textarea{background:#f2f3ff}.lt .tile,.lt .ur .ic{background:#e3e5ff}.lt .tabs{background:#ffffffdd}.lt .dl{background:linear-gradient(120deg,#e6e4ff,#fff 60%,#d4ccff)}.lt .rw{border-color:#dfe2fb}.lt .pg{background:#dfe2fb}.lt .sw{background:#c9cdee}.lt .pcd{background:#f2f3ff}

.core{transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.orb.p .core{transition:transform .06s}
.orb.hit .core{animation:hit .4s}
@keyframes hit{0%{box-shadow:0 0 70px 14px var(--p1),inset 0 0 30px #fff}100%{box-shadow:0 0 30px color-mix(in srgb,var(--p1) 60%,transparent),inset 0 2px 8px #ffffff55}}
.orb.hit .halo{animation:spin 5s linear infinite,hp .4s}
@keyframes hp{40%{transform:scale(1.35);opacity:1}}
@keyframes fl{0%{transform:translate(0,0) scale(.5);opacity:0}15%{opacity:1;transform:translate(0,-12px) scale(1.25)}to{transform:translate(var(--dx,0),-95px) scale(1);opacity:0}}
@keyframes rp{from{transform:scale(.6);opacity:.9}to{transform:scale(7);opacity:0}}
#app.shk{animation:shk .35s}
@keyframes shk{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,-2px)}80%{transform:translate(3px,2px)}}
.flw{position:fixed;inset:0;pointer-events:none;z-index:7;background:radial-gradient(circle at var(--fx) var(--fy),#ffd16699,transparent 60%);animation:fw .45s forwards}
@keyframes fw{to{opacity:0}}

/* perf */
.tabs{backdrop-filter:none;-webkit-backdrop-filter:none;background:#0c0c20f2}
.orb .halo{filter:none;inset:-10px;background:radial-gradient(circle,color-mix(in srgb,var(--p1) 45%,transparent) 40%,transparent 70%);animation:hb 2.4s ease-in-out infinite}

#boss{position:absolute;left:14px;right:14px;top:30%;z-index:35;text-align:center;padding:16px;border-radius:24px;background:linear-gradient(160deg,#2a1a5af2,#12082af2);border:1px solid var(--p1);box-shadow:0 0 40px color-mix(in srgb,var(--p1) 50%,transparent);animation:in .25s}
#boss .bt{font-weight:800;font-size:16px;color:#fff}#boss .bb{font-size:70px;display:block;margin:6px auto;animation:bob 1s infinite}#boss .bb:active{transform:scale(.85)}
.bh{height:12px;background:#2a2a50;border-radius:8px;overflow:hidden}.bh i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5d6c,#ffb35d);transition:width .1s}
.btm{font-size:12px;color:#b6b9dc;margin-top:6px}

/* ===== новый дизайн ===== */
:root{--bg:#04050d;--line:#25264d;--mut:#9ba0cf}
#app{background:radial-gradient(90% 38% at 50% -6%,#33208a88,transparent 70%),radial-gradient(60% 30% at 100% 42%,#3a1a9a30,transparent 70%),radial-gradient(60% 30% at 0 72%,#2a1a7a30,transparent 70%),#04050d}
main{padding:8px 12px 88px}
.v{display:flex;flex-direction:column}.v>.fx{flex:1;min-height:0;height:auto}
.hd{gap:10px;margin:0 0 8px;padding-top:2px}

.hd h1{font-size:19px;letter-spacing:.2px}.hd .t small{font-size:11.5px;color:var(--mut);display:block;margin-top:1px}
.ibs{display:flex;gap:6px}.ib{position:relative;width:36px;height:36px;border-radius:11px;background:linear-gradient(160deg,#17183c,#0b0c22);border:1px solid var(--line);font-size:17px;display:grid;place-items:center;flex:none}

.mc{position:relative;overflow:hidden;padding:12px 10px;display:grid;grid-template-columns:minmax(0,1fr) 108px minmax(0,1fr);grid-template-areas:"a o c" "a o d" "e f g";gap:6px;align-items:center;margin-bottom:8px;background:linear-gradient(165deg,#0f1030,#080918)}

<script>
const $=s=>document.querySelector(s);
const nf=n=>Math.floor(n).toLocaleString('ru-RU');
const money=n=>(Math.abs(n)<100&&n%1?n.toLocaleString('ru-RU',{maximumFractionDigits:1}):Math.floor(n).toLocaleString('ru-RU'));
const CN='<i class="cn">♛</i>';
const UP=[
{id:'click',n:'Усиление клика',d:'+1 монета за клик',i:'<span class="gi">👆</span>',k:'k1',b:50,g:1.5,s:1},
{id:'auto',n:'Авто-кликер',d:'Зарабатывает автоматически',i:'<svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2 4 7-3 1.5-4-7-5 4z" fill="#b39bff"/></svg>',k:'k2',b:250,g:1.6},
{id:'boost',n:'Буст монет',d:'Увеличивает доход на 50%',i:'<svg viewBox="0 0 24 24"><path d="M8 20V8M4 12l4-5 4 5M16 20V4M12 8l4-5 4 5" fill="none" stroke="#3fe08a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',k:'k3',b:500,g:1.8},
{id:'off',n:'Оффлайн доход',d:'Заработок пока ты не в игре',i:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="2"/><path d="M12 7v5l3 2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>',k:'k4',b:1000,g:2},
{id:'crit',n:'Бонус за клик',d:'Шанс получить x2 – x10',i:'🪙',k:'k5',b:2500,g:1.7,m:10},
{id:'spd',n:'Скорость дохода',d:'Увеличивает доход в секунду',i:'<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#a58bff"/><path d="M2 8h4M1 12h3M2 16h4" stroke="#a58bff" stroke-width="1.5" stroke-linecap="round"/></svg>',k:'k6',b:5000,g:1.8,m:20},
{id:'critm',n:'Мощь бонуса',d:'Растёт максимум множителя',i:'💥',b:3000,g:1.9,m:6},
{id:'btime',n:'Частый бонус',d:'Бонус ×2 на 30 сек чаще',i:'⏱️',b:600,g:1.8,m:6},
{id:'bdur',n:'Долгий бонус',d:'+10 сек к длительности ×2',i:'⌛',b:700,g:1.8,m:10},
{id:'gluck',n:'Частая монета',d:'Золотая монета чаще',i:'🍀',b:900,g:1.8,m:8},
{id:'gbig',n:'Крупная монета',d:'+50% к награде монеты',i:'💰',b:1100,g:1.9,m:10}];
const def=()=>({c:60,tot:0,clicks:0,crits:0,u:{},auto:0,bn:Date.now()+277000,dl:0,dlLast:0,streak:0,ac:{},last:Date.now(),tab:0,play:0,run:0,stars:0,tk:3,prem:'',x3:0,au5:0,skin:'neon',skins:{neon:1},ch:{c1:0,c2:0,c3:0},chOpen:0,buys:0,boosts:0,bt:{},maxBal:0,maxIps:0,maxHit:0,acf:'all',snd:0,vib:1,light:0,hist:[],dq:null,ups:0,pet:0,tut:0,fxq:2,nick:'',bosses:0,golds:0,maxMul:0,qdone:0,xp:0,plv:1,sub:0,seenAnn:[],gev:null});
let S=def();try{Object.assign(S,JSON.parse(localStorage.getItem('empire1')||'{}'))}catch(e){}
S.tab=0;if(!(S.sub>=0&&S.sub<=3))S.sub=0;
const save=()=>{S.last=Date.now();try{localStorage.setItem('empire1',JSON.stringify(S))}catch(e){}};
const lv=id=>S.u[id]||(id==='click'?1:0);
const U=id=>UP.find(x=>x.id===id);
let CFG={clickMul:1,incomeMul:1,priceMul:1,shopSale:0,maintenance:false};
const price=id=>{const u=U(id);return Math.max(1,Math.round(u.b*Math.pow(u.g,lv(id)-(u.s||0))*CFG.priceMul))};
const dur=()=>(30+10*lv('bdur'))*1000,gap=()=>Math.max(60,300-30*lv('btime'))*1000;
const bnOn=()=>{const n=Date.now();return n>=S.bn&&n<S.bn+dur()};
const EV=()=>{const d=new Date().getDay();return d===0||d===6?{n:'🎉 Выходные: доход ×1.5',m:1.5}:{n:'',m:1}};
const gev=()=>S.gev&&(!S.gev.until||S.gev.until>Date.now())?S.gev.m:1;
const gm=()=>gev()*EV().m*(1+.25*S.stars)*({gold:1.2,plat:1.35,black:1.5}[S.prem]||1)*(Date.now()<S.x3?3:1);
const base=()=>lv('click')*(1+.5*lv('boost'))*gm();
const cv=()=>base()*(bnOn()?2:1)*CFG.clickMul;
const ips=()=>{const n=Date.now(),au=(S.auto&&lv('auto')?lv('auto'):0)+(n<S.au5?5:0);return (au+S.pet*.3)*base()*(bnOn()?2:1)*(1+.25*lv('spd'))*CFG.incomeMul};
const need=()=>1000*S.plv;
function xpAdd(n){S.xp+=n;while(S.xp>=need()){S.xp-=need();S.plv++;const r=250*S.plv;add(r);toast('🎉 Уровень '+S.plv+'! Сундук: +'+money(r));sfx.buy()}}
const totLv=()=>UP.reduce((s,u)=>s+lv(u.id)-(u.s||0),0);
const pad=n=>String(n).padStart(2,'0'),mmss=s=>pad(Math.floor(s/60))+':'+pad(Math.floor(s%60));
const AC=[];[10,50,100,500,1000,5000,10000].forEach((n,i)=>AC.push({id:'k'+n,n:'Кликов: '+nf(n),r:20*Math.pow(3,i),p:()=>S.clicks,t:n}));
[100,1000,10000,100000,1000000].forEach((n,i)=>AC.push({id:'c'+n,n:'Всего монет: '+nf(n),r:50*Math.pow(4,i),p:()=>S.tot,t:n}));
[3,10,25].forEach((n,i)=>AC.push({id:'u'+n,n:'Уровней улучшений: '+n,r:100*Math.pow(5,i),p:totLv,t:n}));
[5,25].forEach(n=>AC.push({id:'x'+n,n:'Крит-ударов: '+n,r:n*10,p:()=>S.crits,t:n}));
const AR=(id,n,p,t,r,tk)=>AC.push({id,n,p,t,r,tk:tk||0});
[25000,100000].forEach((n,i)=>AR('k'+n,'Кликов: '+nf(n),()=>S.clicks,n,2000*Math.pow(4,i),i));
[1e7,1e8,1e9].forEach((n,i)=>AR('c'+n,'Всего монет: '+nf(n),()=>S.tot,n,5e4*Math.pow(10,i),i+1));
[50,100].forEach((n,i)=>AR('u'+n,'Уровней улучшений: '+n,totLv,n,2e4*Math.pow(5,i),1));
[100,500].forEach((n,i)=>AR('x'+n,'Крит-ударов: '+nf(n),()=>S.crits,n,3000*Math.pow(5,i),i));
[1.5,2,2.5,3].forEach((v,i)=>AR('m'+i,'Комбо ×'+v,()=>S.maxMul||0,v,300*Math.pow(3,i),i>1?1:0));
[1,5,15,40].forEach((n,i)=>AR('b'+n,'Побеждено боссов: '+n,()=>S.bosses,n,500*Math.pow(4,i),i>0?1:0));
[1,10,50].forEach((n,i)=>AR('g'+n,'Поймано золотых монет: '+n,()=>S.golds,n,400*Math.pow(5,i),i));
[1,3,10].forEach((n,i)=>AR('s'+n,'Перерождений (⭐): '+n,()=>S.stars,n,5000*Math.pow(6,i),i+1));
[1,5,10].forEach((n,i)=>AR('p'+n,'Уровень питомца: '+n,()=>S.pet,n,1000*Math.pow(4,i),i));
[3,7,14].forEach((n,i)=>AR('d'+n,'Ежедневная серия: '+n+' дн.',()=>S.streak,n,800*Math.pow(3,i),i+1));
[2,4,6].forEach((n,i)=>AR('z'+n,'Скинов открыто: '+n,()=>Object.keys(S.skins).length,n,1500*Math.pow(4,i),i));
[1,5,15].forEach((n,i)=>AR('q'+n,'Дней с выполненными заданиями: '+n,()=>S.qdone,n,600*Math.pow(4,i),i));
const AR2=(id,n,p,t,r,tk,it)=>AC.push({id,n,p,t,r:Math.min(1e13,Math.round(r)),tk:tk||0,it:it||null});
const itm=(i,len)=>i===len-1?{k:'chest',id:'c3',n:1}:(i+1)%5===0?{k:'chest',id:'c1',n:1}:(i+1)%7===0?{k:'boost',id:'x3',n:1}:null;
const GEN=(id,name,p,arr,base,g)=>arr.forEach((t,i)=>AR2(id+t,name.replace('{t}',nf(t)),p,t,base*Math.pow(g,i),(i+1)%3===0?Math.ceil((i+1)/3):0,itm(i,arr.length)));
GEN('k','Кликов: {t}',()=>S.clicks,[250,2500,50000,250000,500000,1e6,2.5e6,5e6,1e7],3000,3.2);
GEN('bal','Накопить монет: {t}',()=>S.maxBal||0,[1e3,1e4,1e5,1e6,1e7,1e8,1e9,1e10,1e11],200,6);
GEN('c','Всего монет: {t}',()=>S.tot,[1e10,1e11,1e12],5e6,12);
GEN('lv','Уровень игрока: {t}',()=>S.plv||1,[2,3,5,8,10,15,20,25,30,40,50,75,100],300,1.7);
GEN('u','Уровней улучшений: {t}',totLv,[150,200,300,500],1e5,4);
UP.forEach(u=>[1,5,10,25].filter(t=>t<=(u.m||1e9)).forEach((t,i,a)=>AR2('up_'+u.id+'_'+t,u.n+': уровень '+t,()=>lv(u.id)-(u.s||0),t,200*Math.pow(3.5,i)*(1+UP.indexOf(u)*.15),i===a.length-1?1:0,null)));
GEN('x','Крит-ударов: {t}',()=>S.crits,[1000,5000,20000],2e4,6);
GEN('b','Побеждено боссов: {t}',()=>S.bosses,[100,250,500],1e5,4);
['Пришелец','Дракон','Робот-прыгун','Призрак','Тролль','Кракен'].forEach((nm,ix)=>[1,10].forEach((t,i)=>AR2('bt_'+ix+'_'+t,t===1?'Победить босса: '+nm:'Победить босса «'+nm+'» ×'+t,()=>(S.bt||{})[nm]||0,t,(800+ix*200)*Math.pow(8,i),i,i?{k:'chest',id:'c2',n:1}:null)));
GEN('g','Поймано золотых монет: {t}',()=>S.golds,[100,250,500,1000],1e4,4);
GEN('s','Перерождений (⭐): {t}',()=>S.stars,[25,50,100],5e5,8);
GEN('p','Уровень питомца: {t}',()=>S.pet,[15,20,30,50],2e4,5);
GEN('d','Ежедневная серия: {t} дн.',()=>S.streak,[21,30,60,100],5e3,4);
AR2('z8','Скинов открыто: 8',()=>Object.keys(S.skins).length,8,5e4,2,{k:'chest',id:'c3',n:1});
GEN('q','Дней с выполненными заданиями: {t}',()=>S.qdone,[30,60,100,200],1e4,4);
GEN('ch','Открыто сундуков: {t}',()=>S.chOpen||0,[1,5,10,25,50,100,250],1500,3.5);
GEN('sh','Покупок в магазине: {t}',()=>S.buys||0,[1,5,10,25,50,100],1000,3.5);
[10,30,60,180,600,1440,3000].forEach((t,i,a)=>AR2('tm'+t,'Время в игре: '+(t<60?t+' мин':(t/60)+' ч'),()=>Math.floor(S.play/60),t,1500*Math.pow(3.2,i),(i+1)%3===0?(i+1)/3:0,itm(i,a.length)));
GEN('bo','Ускорителей активировано: {t}',()=>S.boosts||0,[1,5,10,25,50],1500,4);
GEN('mt','Получено достижений: {t}',()=>AC.filter(a=>S.ac[a.id]).length,[10,25,50,100,150],2000,7);
GEN('ip','Доход в секунду: {t}',()=>S.maxIps||0,[1,10,100,1e3,1e4],500,9);
GEN('ht','Максимальный клик: {t}',()=>S.maxHit||0,[10,100,1000],1500,8);
/* bindings */
let dispBal=0,lastTot=S.tot,dlN=0;
const B=k=>{if(k.startsWith('bx:')){const t=S[k.slice(3)]-Date.now();return t>0?mmss(t/1000):'—'}
 if(k==='bal')return money(dispBal);if(k==='ev')return gev()>1?'⚡ '+S.gev.n+' ×'+S.gev.m:(EV().n||'Зарабатывай по клику');if(k==='tot')return nf(S.tot);if(k==='cv')return '+'+money(cv());if(k==='cvh')return money(cv());if(k==='ips')return money(ips());if(k==='plv')return S.plv;if(k==='xpt')return nf(S.xp)+' / '+nf(need())+' опыта';
 if(k==='bn')return bnOn()?'Активен '+mmss((S.bn+dur()-Date.now())/1000):'Через '+mmss(Math.max(0,(S.bn-Date.now())/1000));
 if(k==='dl'){const r=S.dl-Date.now();return r>0?Math.floor(r/36e5)+'ч '+pad(Math.floor(r/6e4)%60)+'м':'Забрать'}
 if(k.startsWith('pr:'))return money(price(k.slice(3)));if(k.startsWith('lv:'))return 'Уровень '+(lv(k.slice(3))-(U(k.slice(3)).s||0));
 if(k==='tk')return S.tk;if(k==='st')return 'Серия: '+S.streak+' дн. · день '+(S.streak?((S.streak-1)%30)+1:1)+'/30';if(k==='pgt')return 'Получите ⭐ '+pg()+' · монет за забег: '+nf(S.run);
 return ''};
const bd=k=>`<span data-b="${k}">${B(k)}</span>`;
function sb(e,f,done){const w=f*100+'%',i=e.firstChild;if(i.style.width!==w)i.style.width=w;const bt=e.closest('.ur').querySelector('button'),no=f<1||done,tx=done?'Получено':'Забрать';if(bt.classList.contains('no')!==no)bt.classList.toggle('no',no);if(bt.textContent!==tx)bt.textContent=tx}
let lu=0,BN,PN,AN;
function upd(f){const nw=performance.now();if(!f&&nw-lu<90)return;lu=nw;if(S.tab===3&&claimN()!==ccount){render();return}dispBal+=(S.c-dispBal)*.3;if(Math.abs(S.c-dispBal)<1)dispBal=S.c;(BN||(BN=[...document.querySelectorAll('[data-b]')])).forEach(e=>{const v=B(e.dataset.b);if(e.textContent!==v)e.textContent=v});
 (PN||(PN=[...document.querySelectorAll('[data-p]')])).forEach(e=>{const u=U(e.dataset.p),mx=u.m&&lv(u.id)>=u.m;e.classList.toggle('no',mx||S.c<price(u.id))});
 const b=$('#bnc');if(b)b.classList.toggle('on',bnOn());
 const cb=$('#cmb');if(cb){const on=Date.now()-lastTap<800&&combo>=3;cb.textContent=on?'КОМБО ×'+cmul(combo).toFixed(1):'';cb.classList.toggle('on',on)}
 const w=$('#arc');if(w){const n=Date.now(),f=bnOn()?1-(n-S.bn)/dur():Math.min(1,1-(S.bn-n)/gap());w.style.strokeDashoffset=(1-Math.max(0,Math.min(1,f)))*503+''}
 (AN||(AN=[...document.querySelectorAll('[data-ac]')])).forEach(e=>{const a=AC.find(x=>x.id===e.dataset.ac),f=Math.min(1,a.p()/a.t);sb(e,f,!!S.ac[a.id])});
 if(S.tab===3)document.querySelectorAll('[data-q]').forEach(e=>{const q=S.dq.q[+e.dataset.q],f=Math.min(1,(QK[q.k][1]()-S.dq.b[q.k])/q.g);sb(e,f,!!q.c)});
 const xb=$('#xpb');if(xb){const w=Math.max(4,Math.min(100,S.xp/need()*100))+'%';if(xb.style.width!==w)xb.style.width=w}
 const be=$('.bal b');if(be){const l=be.textContent.length,fz=l>11?'12px':l>9?'15px':l>7?'18px':'21px';if(be.style.fontSize!==fz)be.style.fontSize=fz}
 const d=$('#dlb');if(d)d.classList.toggle('no',Date.now()<S.dl)}
function toast(t,bad){if(bad)sfx.bad();const e=$('#toast');e.textContent=t;e.className='on'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}
/* views */
const CROWN='<svg viewBox="0 0 64 64"><path d="M8 24l13 10 11-20 11 20 13-10-5 25H13z"/><rect x="13" y="51" width="38" height="6" rx="3"/></svg>';
const BOLT='<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>';
const TASK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 12l3 3 5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const GIFT='<svg viewBox="0 0 24 24"><path d="M3 9h18v4H3zM5 13h14v8H5zM12 9v12" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 9C9 9 7.5 7.500 8 6c1-2 4 0 4 3zM12 9c3 0 4.500-1.500 4-3-1-2-4 0-4 3z" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const CART='<svg viewBox="0 0 24 24"><path d="M3 4h2l2.500 12h11L20 8H7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="9" cy="20" r="1.600"/><circle cx="17" cy="20" r="1.600"/></svg>';
const CUR='<svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2 4 7-3 1.5-4-7-5 4z"/></svg>';

const CHEST='<svg class="chest" viewBox="0 0 64 56"><path d="M6 24a26 15 0 0152 0v6H6z" fill="#34346a"/><rect x="6" y="28" width="52" height="24" rx="3" fill="#202046"/><rect x="26" y="25" width="12" height="15" rx="2" fill="#8f7bff"/><path d="M6 24h52M6 38h52" stroke="#7b5cff" stroke-width="2"/></svg>';

const TN=['Кликер','Улучшения','Магазин','Награды','Профиль'];
function tabs(){$('#tabs').innerHTML=TN.map((n,i)=>`<button class="${S.tab===i?'on':''}" data-a="tab" data-x="${i}">${IC[i]}${n}</button>`).join('')}
const ibtn=(a,x,ic,dot)=>`<button class="ib" data-a="${a}" data-x="${x}">${ic}${dot?'<i class="dot"></i>':''}</button>`;
const OIC={click:'⚡',auto:'🖱️',boost:'⬆️',off:'⏰',crit:'🪙',spd:'⚡',critm:'💥',btime:'⏱️',bdur:'⌛',gluck:'🍀',gbig:'💰'};
const hd=()=>`<div class="hd"><div class="tile">👑</div><div class="t"><h1>Empire Clicker</h1><small>${bd('ev')}</small></div><button class="card balc" data-a="tab" data-x="4"><i>▣</i><div><small>Баланс</small><b>${bd('bal')} ♛</b></div><span style="color:var(--mut);margin-left:6px">›</span></button></div>`;

 async nick(){const n=($('#nick').value||'').trim().slice(0,20);if(n.length<2)return toast('Ник: минимум 2 символа',1);if(!UID){S.nick=n;save();return toast('Ник сохранён')}try{await api('/nick',{method:'PUT',body:JSON.stringify({nick:n})});S.nick=n;save();toast('Ник сохранён');fetchLB()}catch(e){toast(e.message,1)}},
 buyall(){let n=0;for(let i=0;i<300;i++){let b=null;UP.forEach(u=>{if(u.m&&lv(u.id)>=u.m)return;const p=price(u.id);if(p<=S.c&&(!b||p<b.p))b={u,p}});if(!b)break;S.c-=b.p;S.u[b.u.id]=lv(b.u.id)+1;S.ups++;n++}n?(sfx.buy(),toast('Куплено улучшений: '+n)):toast('Не хватает монет',1);render();save()},
 pet(){const p=petCost();if(S.c<p)return toast('Недостаточно монет',1);S.c-=p;S.pet++;sfx.buy();toast(S.pet===1?'🥚 Питомец с вами!':'🍖 Питомец вырос до ур. '+S.pet);render();save()},
 fxq(){S.fxq=(S.fxq+2)%3;applyTheme();render();save()},
 share(){const t='Я заработал '+nf(S.tot)+' монет в Empire Clicker! ⭐ '+S.stars;try{if(navigator.share)navigator.share({text:t});else navigator.clipboard.writeText(t)}catch(e){}toast('Результат скопирован')},
 boss(){if(!boss||boss.off)return;boss.hp--;const bt=document.querySelector('#boss .bb'),r=bt.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,false);vib(10);sfx.tap();document.querySelector('#boss .bh i').style.width=Math.max(0,boss.hp/boss.max*100)+'%';if(boss.b.k==='jump'){bt.style.position='relative';bt.style.left=(Math.random()*180-90)+'px'}if(boss.hp<=0)endBoss(1)},
 tut(i){if(+i>=TUT.length){const d=$('#tut');d&&d.remove();S.tut=1;save()}else showTut(+i)},
 qc(i){const q=S.dq.q[i];if(q.c||QK[q.k][1]()-S.dq.b[q.k]<q.g)return;q.c=1;add(q.r);sfx.buy();toast('📋 +'+nf(q.r)+' монет');lastCl='q'+i;if(S.dq.q.every(z=>z.c)){S.tk++;S.qdone++;toast('📋 Все задания! 🎟️ +1')}upd(1);save()},
 sbuy(x){const[k,v]=x.split(':');
  if(k==='chest'){const c=CH[v],p=sp(c.p);if(S.c<p)return toast('Недостаточно средств',1);S.c-=p;S.buys=(S.buys||0)+1;S.ch[v]=(S.ch[v]||0)+1;sfx.buy();toast(c.e+' '+c.n+' куплен — откройте его!')}
  else if(k==='boost'){const b=BSTS[v],p=sp(b.p);if(S.c<p)return toast('Недостаточно средств',1);S.c-=p;S.buys=(S.buys||0)+1;grantBoost(v,1);sfx.buy();toast(b.e+' '+b.n+' включён!')}
  render();save()},
 copen(id){if(!(S.ch[id]>0))return;S.ch[id]--;S.chOpen=(S.chOpen||0)+1;const c=CH[id],r=chestRoll(id),L=[];add(r.c);L.push('💰 '+money(r.c));if(r.tk){S.tk+=r.tk;L.push('🎟️ +'+r.tk+' '+(r.tk===1?'билет':'билетов'))}if(r.boost){grantBoost(r.boost,1);L.push(itemLabel({k:'boost',id:r.boost,n:1}))}if(r.skin){S.skins[r.skin]=1;L.push(itemLabel({k:'skin',id:r.skin,n:1}))}
  sfx.gold();ovl(`<div class="em">${c.e}</div><h3>${c.n} открыт!</h3><p>${L.join('<br>')}</p><button class="up wide" data-a="ovx">Забрать</button>`);render();save()},
 arm(x){if(armId===x){armId='';clearTimeout(armT);return A.go(x)}armId=x;clearTimeout(armT);armT=setTimeout(()=>armId='',3000);toast(/^(buy|pack)/.test(x)?'Нажмите ещё раз — демо-оплата':'Нажмите ещё раз для подтверждения')},
 go(x){const[k,v]=x.split(':');
  if(k==='buy'){if(RKp[S.prem]>=RKp[v])return toast('Уже действует бонус не ниже',1);S.prem=v;sfx.buy();toast('💳 Карта '+PRM[v][0]+' активна!')}
  else if(k==='pack'){S.tk+=PACK[v][0];sfx.buy();toast('🎟️ +'+PACK[v][0]+' билетов')}
  else if(k==='bst'){const b=BST.find(z=>z.id===v);if(S.tk<b.t)return toast('Не хватает билетов',1);S.tk-=b.t;const n=Date.now();if(v==='x3')S.x3=Math.max(n,S.x3)+6e5;else if(v==='a5')S.au5=Math.max(n,S.au5)+6e5;else S.bn=n;sfx.buy();toast(b.i+' '+b.n+' включено')}
  else if(k==='prest'){const g=pg();if(g<1)return toast('Нужно больше монет за забег',1);S.stars+=g;S.c=0;S.run=0;S.u={};S.auto=0;S.bn=Date.now()+277000;sfx.buy();toast('⭐ +'+g+' звёзд! Доход ×'+(1+.25*S.stars).toFixed(2))}
  else if(k==='reset'){S=def();applyTheme();lastCk='';cloudPush(1)}
  render();save()},
 gold(){const g=$('.gold');if(!g)return;const r=Math.max(50,cv()*40)*(1+.5*lv('gbig'));add(r);let t='✨ Золотая монета: +'+nf(r);if(Math.random()<.2){S.tk++;t+=' и 🎟️ +1'}toast(t);g.remove();S.golds++;xpAdd(10);sfx.gold();upd(1);save()},
 set(k){S[k]=S[k]?0:1;applyTheme();render();save()},
 skin(id){const k=SK[id];if(!S.skins[id]){const pr=sp(k.c);if(S.c<pr)return toast('Нужно '+nf(pr)+' монет',1);S.c-=pr;S.buys=(S.buys||0)+1;S.skins[id]=1;sfx.buy()}S.skin=id;applyTheme();render();save()},
 exp(){const t=$('#sv');t.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{navigator.clipboard.writeText(t.value)}catch(e){}toast('Код сохранения готов')},
 imp(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#sv').value.trim()))));S=Object.assign(def(),o);applyTheme();render();save();cloudPush(1);toast('Сохранение загружено')}catch(e){toast('Неверный код',1)}},
 tab(x){S.tab=+x;render();if(S.tab===4)fetchLB()},
 up(id){const u=U(id);if(u.m&&lv(id)>=u.m)return;const p=price(id);if(S.c<p)return toast('Недостаточно монет',1);S.c-=p;S.u[id]=lv(id)+1;S.ups++;xpAdd(5);sfx.buy();toast('✨ '+u.n+' — уровень '+(lv(id)-(u.s||0)));render();flash(id);save()},
 atg(){if(!lv('auto'))return toast('Сначала улучшите Авто-кликер',1);S.auto=S.auto?0:1;render()},
 daily(){const n=Date.now();if(n<S.dl)return toast('Бонус будет доступен через '+B('dl'),1);S.streak=(S.dlLast&&n-S.dlLast<1728e5)?S.streak+1:1;S.dlLast=n;const d=((S.streak-1)%30)+1,g=Math.round((100+50*totLv())*d*(d%7===0?3:1)*(d===30?5:1));add(g);let ex='';if(d%7===0){S.tk+=2;ex=' и 🎟️ +2'}if(d===30){S.ch.c3=(S.ch.c3||0)+1;ex+=' и 👑 сундук'}else if(d%10===0){S.ch.c2=(S.ch.c2||0)+1;ex+=' и 🎁 сундук'}S.dl=n+864e5;dlN=0;sfx.buy();toast('🎁 День '+d+'/30: +'+money(g)+ex);render();save()},
 acf(x){S.acf=x;render()},
 achall(){let c=0,tk=0,n=0;const items=[];AC.forEach(a=>{if(S.ac[a.id]||a.p()<a.t)return;S.ac[a.id]=1;n++;c+=a.r;tk+=a.tk||0;if(a.it){grantItem(a.it.k,a.it.id,a.it.n||1);items.push(a.it)}});if(!n)return;add(c);S.tk+=tk;sfx.gold();toast('🏆 Получено наград: '+n+' · +'+money(c)+(tk?' · 🎟️ '+tk:'')+(items.length?' · предметов: '+items.length:''));render();save()},
 ach(id){const a=AC.find(x=>x.id===id);if(S.ac[id]||a.p()<a.t)return;S.ac[id]=1;add(a.r);if(a.tk)S.tk+=a.tk;if(a.it)grantItem(a.it.k,a.it.id,a.it.n||1);sfx.buy();toast('🏆 +'+nf(a.r)+' монет'+(a.tk?' и 🎟️ +'+a.tk:'')+(a.it?' и '+itemLabel(a.it):''));lastCl=id;render();save()},
 reset(){A.arm('reset')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset.x)});
document.addEventListener('pointerdown',e=>{if(!ACX){try{ACX=new(window.AudioContext||window.webkitAudioContext)()}catch(x){}}const o=e.target.closest('#orb');if(o){o.classList.add('p');const b=o.getBoundingClientRect(),dx=(e.clientX-b.left-b.width/2)/(b.width/2),dy=(e.clientY-b.top-b.height/2)/(b.height/2),c=o.querySelector('.core');c.style.transform='perspective(300px) rotateX('+(-dy*16)+'deg) rotateY('+(dx*16)+'deg) scale(.91)';tap(e.clientX,e.clientY)}});
['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,()=>{const o=$('#orb');if(o){o.classList.remove('p');o.querySelector('.core').style.transform=''}}));
setInterval(()=>{const n=Date.now();if(n>=S.bn+dur())S.bn=n+gap();S.play++;S.maxBal=Math.max(S.maxBal||0,S.c);S.maxIps=Math.max(S.maxIps||0,ips());
 {const g=ips();if(g)add(g)}
 if(n>=ng&&!$('.gold'))spawnGold();
 if(boss){const e=document.querySelector('#boss .btm');if(e)e.textContent='Осталось '+Math.max(0,Math.ceil((boss.end-n)/1000))+' сек.';if(n>=boss.end)endBoss(0)}else if(n>=nb&&S.tab===0&&!$('.gold'))spawnBoss();
 if(n>=S.dl&&!dlN){dlN=1;if(S.play>5)toast('🎁 Ежедневный бонус готов!')}
 if(S.play%20===0)pushLB();
 if(S.play%15===0)cloudPush();
 if(S.play%30===0)pollSync();
 if(S.play%10===0){S.hist.push(Math.round(S.tot-lastTot));lastTot=S.tot;if(S.hist.length>30)S.hist.shift()}
 upd();if(S.play%5===0)save()},1000);
(function(){const away=Math.min(28800,(Date.now()-S.last)/1000);if(lv('off')&&away>60){const g=away*.1*lv('off')*base();add(g);setTimeout(()=>toast('⏰ Пока вас не было: +'+nf(g)+' монет'),600)}})();
if(!S.sv2){S.snd=0;S.sv2=1}
ensureQ();if(!S.tut)showTut(0);initAuth();addEventListener('pagehide',()=>cloudPush(1));setInterval(()=>{if(S.tab===4&&UID)fetchLB()},15000);
applyTheme();render();setInterval(()=>upd(),120);
</script></body></html>
